<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  // <base href="../"> siempre, asi los './' resuelven en file:// y https://
  (function() {
      document.write('<base href="../">');
      document.addEventListener('click', function(e) {
          var a = e.target.closest('a[href^="#"]');
          if (a) { e.preventDefault(); var el = document.getElementById(a.getAttribute('href').substring(1)); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
      });
  })();
  </script>
  <title>Acceso al dashboard | Patagónica Propiedades</title>
  <link rel="icon" type="image/png" href="./src/img/patagonica-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://d1v2p1s05qqabi.cloudfront.net/fonts/patagonica/fonts-patagonica.css" rel="stylesheet">
  <style>
    :root {
      --primary: #121C25;
      --secondary: #057488;
      --light: #f7f7f7;
      --text: #2a2a2a;
      --text-muted: #6c757d;
      --border: #e4ddd4;
      --br: 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: Gilroy, 'Source Sans Pro', sans-serif;
      color: var(--text);
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { display: block; margin: 0 auto 1.5rem; height: 36px; }
    h1 {
      font-family: Gilroy;
      font-weight: 400;
      font-size: 1.4rem;
      color: var(--primary);
      text-align: center;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--br);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--secondary);
    }
    .field { margin-bottom: 1rem; }
    button {
      width: 100%;
      padding: 0.95rem 1rem;
      background: var(--secondary);
      color: #fff;
      border: none;
      border-radius: var(--br);
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    button:hover { background: #04606f; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: var(--br);
      font-size: 0.85rem;
      display: none;
    }
    .msg.ok {
      background: #f0fafa;
      color: var(--secondary);
      border-left: 3px solid var(--secondary);
    }
    .msg.err {
      background: #fff5f5;
      color: #c0392b;
      border-left: 3px solid #c0392b;
    }
    .msg.show { display: block; }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--primary);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.25rem;
      z-index: 100;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--secondary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-overlay p {
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <img class="logo" src="./src/img/patagonica-logo-blanco.png" alt="Patagónica Propiedades" style="filter: invert(1) brightness(0.2);">
    <h1>Dashboard de reportes</h1>
    <p class="subtitle">Ingresá tus credenciales para acceder</p>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="vos@ejemplo.com">
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>

    <button type="submit" id="submit-btn">Ingresar</button>

    <div class="msg" id="msg"></div>
  </form>

  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <p>Verificando acceso...</p>
  </div>

  <script>
    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://patagonica.onrender.com';

    const TOKEN_KEY = 'patagonica_dashboard_token';
    const form = document.getElementById('login-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');
    const loadingOverlay = document.getElementById('loading-overlay');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg show ' + type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return;

      btn.disabled = true;
      msg.className = 'msg';
      loadingOverlay.classList.add('show');

      try {
        const r = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await r.json();
        if (r.ok && data.token) {
          sessionStorage.setItem(TOKEN_KEY, data.token);
          location.href = 'dashboard/index.html';
        } else {
          loadingOverlay.classList.remove('show');
          showMsg(data.error || 'No se pudo ingresar', 'err');
          btn.disabled = false;
        }
      } catch (err) {
        loadingOverlay.classList.remove('show');
        showMsg('Error de conexión. Probá de nuevo.', 'err');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
