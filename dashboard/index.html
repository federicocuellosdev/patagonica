<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Patagónica Propiedades</title>
  <link rel="icon" type="image/png" href="/mirador/img/patagonica-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://d1v2p1s05qqabi.cloudfront.net/fonts/patagonica/fonts-patagonica.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:           #e7ebf3;
      --bg-2:         #f1f4f9;
      --card:         #ffffff;
      --primary:      #1a3a6e;
      --accent:       #4a90e2;
      --accent-soft:  #cfe1f5;
      --teal:         #057488;
      --teal-soft:    #d6eef1;
      --warm:         #f3e9d7;
      --warm-strong:  #d4a85a;
      --green-soft:   #d4ecdf;
      --green:        #3aa676;
      --rose-soft:    #f4dadf;
      --rose:         #c0526a;
      --text:         #1a3a6e;
      --text-muted:   #6e7b96;
      --text-soft:    #93a1bd;
      --border:       #e3e8ef;
      --br-card:      22px;
      --br-pill:      50px;
      --br-input:     14px;
      --shadow:       0 2px 14px rgba(26, 58, 110, 0.05);
      --shadow-lg:    0 4px 24px rgba(26, 58, 110, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      min-height: 100vh;
      padding: 1.25rem;
    }

    /* Shell */
    .shell {
      max-width: 1320px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 28px;
      padding: 1.5rem 1.75rem 2rem;
      box-shadow: var(--shadow);
    }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem; width: 100%;
    }
    .topbar .nav-pills { flex: 1; justify-content: center; }
    .topbar > .topbar-left,
    .topbar > .topbar-right { flex-shrink: 0; }
    .brand-pill {
      display: inline-flex; align-items: center; gap: 0.55rem;
      padding: 0.35rem 0.95rem 0.35rem 0.4rem;
      background: var(--bg-2); border-radius: var(--br-pill);
      font-weight: 600; font-size: 0.82rem; color: var(--text);
    }
    .brand-pill .dot {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--primary); display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 0.75rem;
    }
    .nav-pills {
      display: flex; gap: 0.3rem; padding: 0.3rem; background: var(--bg-2);
      border-radius: var(--br-pill);
    }
    .nav-pill {
      padding: 0.45rem 1rem; border-radius: var(--br-pill); font-size: 0.78rem;
      color: var(--text-muted); cursor: pointer; border: none; background: transparent;
      font-family: inherit; font-weight: 500; transition: all 0.15s;
    }
    .nav-pill.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(26, 58, 110, 0.2); }
    .nav-pill:not(.active):hover { color: var(--text); }
    .topbar-right { display: flex; align-items: center; gap: 0.6rem; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--card); cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--bg-2); }
    .user-chip {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.3rem 0.85rem 0.3rem 0.3rem;
      background: var(--bg-2); border-radius: var(--br-pill);
    }
    .user-chip .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700;
    }
    .user-chip .email { font-size: 0.78rem; color: var(--text); font-weight: 500; }
    .logout-link {
      font-size: 0.75rem; color: var(--text-muted); text-decoration: none; padding-left: 0.5rem;
      border-left: 1px solid var(--border); cursor: pointer;
    }
    .logout-link:hover { color: var(--rose); }

    /* Welcome */
    .welcome { margin-bottom: 1.5rem; }
    .welcome h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 700; font-size: 2.1rem; line-height: 1.15; color: var(--text);
      letter-spacing: -0.5px; margin-bottom: 0.35rem;
    }
    .welcome .lead { color: var(--text-muted); font-size: 0.92rem; }

    /* Headline metrics — fila horizontal de 4 KPIs */
    .headline-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      padding: 1.5rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .headline-metric { text-align: left; min-width: 0; padding: 0 0.5rem; border-right: 1px solid var(--border); }
    .headline-metric:last-child { border-right: none; }
    .headline-metric .label {
      font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.45rem;
      font-weight: 500; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .headline-metric .value {
      font-size: 2rem; font-weight: 700; line-height: 1; color: var(--text);
      letter-spacing: -0.8px;
    }

    /* Filters bar */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
      padding: 0.7rem 0.9rem; background: var(--bg-2); border-radius: var(--br-pill);
      margin-bottom: 1.5rem;
    }
    .filter-bar .preset-btn {
      padding: 0.45rem 1rem; border-radius: var(--br-pill); font-size: 0.78rem;
      color: var(--text-muted); cursor: pointer; border: none; background: transparent;
      font-family: inherit; font-weight: 500;
    }
    .filter-bar .preset-btn.active,
    .filter-bar .preset-btn:hover { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
    .filter-bar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 0.3rem; }
    .filter-bar .date-input {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.35rem 0.85rem; background: var(--card); border-radius: var(--br-pill);
      box-shadow: var(--shadow);
    }
    .filter-bar .date-input label { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
    .filter-bar .date-input input {
      border: none; background: transparent; font-family: inherit;
      font-size: 0.82rem; color: var(--text); font-weight: 500;
      outline: none; cursor: pointer; padding: 0;
    }
    .filter-bar .resync-btn {
      margin-left: auto; padding: 0.5rem 1rem; border-radius: var(--br-pill);
      background: var(--card); border: 1px solid var(--border);
      color: var(--text-muted); font-family: inherit; font-size: 0.78rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .filter-bar .resync-btn:hover { color: var(--teal); border-color: var(--teal); }
    .filter-bar .resync-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Grid (12 cols) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1rem;
    }
    .card {
      background: var(--card); border-radius: var(--br-card); padding: 1.25rem;
      border: 1px solid var(--border);
    }
    .card.span-3  { grid-column: span 3; }
    .card.span-4  { grid-column: span 4; }
    .card.span-8  { grid-column: span 8; }
    .card.span-9  { grid-column: span 9; }
    .card.span-12 { grid-column: span 12; }
    .card.row-span-2 { grid-row: span 2; }

    /* Delta indicator */
    .card-delta {
      font-size: 0.7rem; font-weight: 600; margin-top: 0.45rem;
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.2rem 0.55rem; border-radius: var(--br-pill);
      white-space: nowrap;
    }
    .delta-up    { background: var(--green-soft); color: var(--green); }
    .delta-down  { background: var(--rose-soft);  color: var(--rose); }
    .delta-flat  { background: var(--bg-2);       color: var(--text-muted); }
    .card.dark .card-delta {
      background: rgba(255,255,255,0.12);
    }
    .card.dark .delta-up { color: #7be0ad; }
    .card.dark .delta-down { color: #ff9aa8; }
    .card-tinted { color: var(--text); }
    .card.tint-blue { background: linear-gradient(135deg, #e8f1ff 0%, #cfe1f5 100%); border-color: transparent; }
    .card.tint-teal { background: linear-gradient(135deg, var(--teal-soft), #b9e0e4); border-color: transparent; }
    .card.tint-warm { background: linear-gradient(135deg, var(--warm), #ecdcb8); border-color: transparent; }
    .card.tint-green { background: linear-gradient(135deg, var(--green-soft), #b6dcc7); border-color: transparent; }
    .card.dark { background: var(--primary); color: #fff; border-color: transparent; }
    .card.dark .card-title,
    .card.dark .muted { color: rgba(255,255,255,0.7); }

    .card-title {
      font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
      margin-bottom: 0.65rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .card-title .pct {
      margin-left: auto;
      background: var(--card); color: var(--accent);
      font-size: 0.7rem; padding: 0.15rem 0.6rem; border-radius: var(--br-pill); font-weight: 700;
    }
    .card-value {
      font-size: 1.85rem; font-weight: 700; letter-spacing: -0.6px;
      line-height: 1; margin-bottom: 0.35rem;
    }
    .card-sub {
      font-size: 0.78rem; color: var(--text-muted);
    }

    /* Progress bars */
    .progress-bars { display: flex; flex-direction: column; gap: 1.15rem; margin-top: 1.25rem; }
    .progress-row { display: flex; align-items: center; gap: 0.85rem; font-size: 0.82rem; padding: 0.25rem 0; }
    .progress-row .name {
      width: 220px; color: var(--text-muted); font-weight: 500; flex-shrink: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .progress-row .bar {
      flex: 1; height: 32px; background: var(--bg-2); border-radius: var(--br-pill); overflow: hidden;
      position: relative;
    }
    .progress-row .bar-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      border-radius: var(--br-pill);
      display: flex; align-items: center; padding-left: 1rem;
      color: #fff; font-size: 0.76rem; font-weight: 700;
      min-width: 36px;
    }
    .bar-fill.blue { background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 100%); }
    .bar-fill.teal { background: linear-gradient(90deg, var(--teal) 0%, #044451 100%); }
    .bar-fill.warm { background: linear-gradient(90deg, var(--warm-strong) 0%, #8a6f33 100%); }
    .progress-row .pct-end { width: 50px; text-align: right; color: var(--text); font-weight: 600; }

    /* Campaign list */
    .campaign-list {
      display: flex; flex-direction: column;
    }
    .campaign-item {
      display: grid; grid-template-columns: 36px 1fr auto auto auto auto auto; gap: 2.25rem; align-items: center;
      padding: 0.85rem 0; border-bottom: 1px solid var(--border);
    }
    .campaign-item .num-cell { min-width: 84px; }
    .campaign-item .info .name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .campaign-item.is-total {
      border-top: 2px solid var(--primary);
      border-bottom: none;
      padding-top: 1.2rem; margin-top: 0.4rem;
    }
    .campaign-item.is-total .icon {
      background: var(--primary); color: #fff;
    }
    .campaign-item.is-total .info .name {
      font-size: 1rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .campaign-item.is-total .info .obj { color: var(--text-muted); }
    .campaign-item.is-total .num-cell .num {
      font-size: 1.08rem; font-weight: 700; color: var(--text);
    }
    .campaign-item.is-total .num-cell .lbl {
      font-weight: 700; color: var(--primary);
    }
    .campaign-item:last-child { border-bottom: none; }
    .campaign-item .icon {
      width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-weight: 700; font-size: 0.78rem;
    }
    .icon-leads { background: var(--teal-soft); color: var(--teal); }
    .icon-awareness { background: var(--warm); color: var(--warm-strong); }
    .icon-traffic { background: var(--accent-soft); color: var(--primary); }
    .campaign-item .info .name { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .campaign-item .info .obj { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; }
    .campaign-item .num-cell { text-align: right; min-width: 70px; }
    .campaign-item .num-cell .num { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .campaign-item .num-cell .lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.1rem; }

    /* Onboarding-style breakdown */
    .breakdown-rows { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.85rem; }
    .br-row {
      display: grid; grid-template-columns: 32px 1fr; gap: 0.6rem; align-items: start;
      padding: 0.7rem 0.85rem; background: var(--bg-2); border-radius: 14px;
    }
    .br-row .br-body { display: flex; flex-direction: column; gap: 0.35rem; }
    .br-row .br-top {
      display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
    }
    .br-row .br-name { font-size: 0.84rem; font-weight: 600; color: var(--text); line-height: 1.25; }
    .br-row .br-value { font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1; flex-shrink: 0; }
    .br-row .br-bottom {
      display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
      padding-top: 0.35rem; border-top: 1px solid rgba(110,123,150,0.12);
    }
    .br-row .br-meta { font-size: 0.7rem; color: var(--text-muted); }
    .br-row .br-cost { font-size: 0.78rem; font-weight: 700; color: var(--teal); flex-shrink: 0; }
    .br-row .br-icon {
      width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .br-icon.blue { background: var(--accent-soft); color: var(--primary); }
    .br-icon.teal { background: var(--teal-soft); color: var(--teal); }
    .br-icon.green { background: var(--green-soft); color: var(--green); }
    .br-icon.warm { background: var(--warm); color: var(--warm-strong); }
    .br-icon.rose { background: var(--rose-soft); color: var(--rose); }
    .br-row .br-name { font-size: 0.86rem; font-weight: 600; color: var(--text); }
    .br-row .br-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; }
    .br-row .br-value { font-size: 0.92rem; font-weight: 700; color: var(--text); }

    /* Loading / states */
    .full-loading {
      display: flex; align-items: center; justify-content: center; min-height: 70vh;
      flex-direction: column; gap: 1rem;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .spinner-inline {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    .state-box {
      grid-column: 1 / -1;
      background: var(--bg-2); border-radius: var(--br-card); padding: 2.5rem; text-align: center;
      color: var(--text-muted); font-size: 0.92rem;
    }
    .state-box.error { background: var(--rose-soft); color: var(--rose); }

    .meta-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 1rem; margin-top: 1.5rem; border-top: 1px solid var(--border);
      font-size: 0.74rem; color: var(--text-soft);
    }
    .meta-footer code { background: var(--bg-2); padding: 0.1rem 0.45rem; border-radius: 4px; font-family: 'Inter', monospace; font-size: 0.95em; }

    /* Chart series toggles (multi-select chips) */
    .chart-toggles {
      display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.75rem;
    }
    .chart-toggle {
      padding: 0.4rem 0.85rem; border-radius: var(--br-pill);
      font-size: 0.74rem; color: var(--text-muted); cursor: pointer;
      border: 1px solid var(--border); background: var(--card);
      font-family: inherit; font-weight: 500;
      display: inline-flex; align-items: center; gap: 0.45rem;
      transition: all 0.15s;
    }
    .chart-toggle:hover { border-color: var(--text-soft); }
    .chart-toggle .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--border); transition: background 0.15s;
      flex-shrink: 0;
    }
    .chart-toggle.active {
      background: var(--bg-2); color: var(--text); border-color: transparent;
    }

    .chart-wrap { position: relative; height: 280px; margin-top: 0.85rem; }

    @media (max-width: 1100px) {
      .dashboard-grid { grid-template-columns: repeat(6, 1fr); }
      .card.span-3 { grid-column: span 3; }
      .card.span-4, .card.span-8, .card.span-9, .card.span-12 { grid-column: span 6; }
      .card.row-span-2 { grid-row: span 1; }
    }
    @media (max-width: 960px) {
      .headline-metrics { grid-template-columns: repeat(2, 1fr); }
      .headline-metric:nth-child(2) { border-right: none; }
    }
    @media (max-width: 640px) {
      body { padding: 0.5rem; }
      .shell { padding: 1rem; border-radius: 18px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .card.span-3, .card.span-4, .card.span-8, .card.span-9, .card.span-12 { grid-column: span 1; }
      .topbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div id="auth-loading" class="full-loading">
    <div class="spinner"></div>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Verificando acceso...</p>
  </div>

  <div id="app" class="hidden">
    <div class="shell">

      <!-- Topbar -->
      <div class="topbar">
        <div class="topbar-left">
          <div class="brand-pill">
            <span class="dot">P</span>
            Patagónica
          </div>
        </div>
        <div class="topbar-right" style="margin-left:auto;">
          <div class="user-chip">
            <span class="avatar" id="user-avatar">F</span>
            <span class="email" id="user-email"></span>
          </div>
          <a class="logout-link" id="logout-btn">Salir</a>
        </div>
      </div>

      <!-- Welcome -->
      <div class="welcome">
        <h1 id="welcome-title">Hola</h1>
        <p class="lead" id="welcome-lead">Performance de Meta Ads y leads de Kommo en el período seleccionado.</p>
      </div>

      <!-- Headline metrics: 4 KPIs horizontales -->
      <div class="headline-metrics" id="headline-metrics"></div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <button class="preset-btn" data-range="7">Últ. 7 días</button>
        <button class="preset-btn active" data-range="30">Últ. 30 días</button>
        <button class="preset-btn" data-range="month">Este mes</button>
        <button class="preset-btn" data-range="lastmonth">Mes anterior</button>
        <button class="preset-btn" data-range="ytd">Este año</button>
        <span class="sep"></span>
        <span class="date-input">
          <label>Desde</label>
          <input type="date" id="desde">
        </span>
        <span class="date-input">
          <label>Hasta</label>
          <input type="date" id="hasta">
        </span>
        <button class="resync-btn" id="refresh-btn">↻ Re-sync histórico</button>
      </div>

      <!-- Grid -->
      <div class="dashboard-grid" id="report-area">
        <div class="state-box"><span class="spinner-inline"></span> Cargando...</div>
      </div>

      <div class="meta-footer" id="meta-footer"></div>
    </div>
  </div>

  <script>
    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://patagonica.onrender.com';
    const TOKEN_KEY = 'patagonica_dashboard_token';

    async function verifyToken(token) {
      const r = await fetch(`${API_BASE}/api/auth/verify`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!r.ok) throw new Error('invalid');
      return r.json();
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem(TOKEN_KEY);
      location.href = 'login.html';
    });

    function formatUSD(n) { if (n == null || isNaN(n)) return '—'; return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: n < 100 ? 2 : 0 }); }
    function formatUSD2(n) { if (n == null || isNaN(n)) return '—'; return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function formatNum(n) { if (n == null || isNaN(n)) return '—'; return Number(n).toLocaleString('es-AR'); }
    function formatPct(n) { if (n == null || isNaN(n)) return '—'; return Number(n).toFixed(2) + '%'; }
    function pad(n) { return String(n).padStart(2, '0'); }
    function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

    function applyPreset(kind) {
      const today = new Date();
      let desde, hasta;
      if (kind === '7' || kind === '30') {
        const days = parseInt(kind);
        hasta = new Date(today);
        desde = new Date(today);
        desde.setDate(desde.getDate() - (days - 1));
      } else if (kind === 'month') {
        desde = new Date(today.getFullYear(), today.getMonth(), 1);
        hasta = new Date(today);
      } else if (kind === 'lastmonth') {
        desde = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        hasta = new Date(today.getFullYear(), today.getMonth(), 0);
      } else if (kind === 'ytd') {
        desde = new Date(today.getFullYear(), 0, 1);
        hasta = new Date(today);
      }
      document.getElementById('desde').value = isoDate(desde);
      document.getElementById('hasta').value = isoDate(hasta);
      document.querySelectorAll('.preset-btn').forEach((b) => b.classList.toggle('active', b.dataset.range === kind));
    }

    document.querySelectorAll('.preset-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        applyPreset(btn.dataset.range);
        fetchReport(false);
      });
    });
    document.getElementById('desde').addEventListener('change', () => {
      document.querySelectorAll('.preset-btn').forEach((b) => b.classList.remove('active'));
      fetchReport(false);
    });
    document.getElementById('hasta').addEventListener('change', () => {
      document.querySelectorAll('.preset-btn').forEach((b) => b.classList.remove('active'));
      fetchReport(false);
    });
    document.getElementById('refresh-btn').addEventListener('click', () => fetchReport(true));

    applyPreset('30');

    async function fetchReport(forceRefresh = false) {
      const token = sessionStorage.getItem(TOKEN_KEY);
      const desde = document.getElementById('desde').value;
      const hasta = document.getElementById('hasta').value;
      if (!desde || !hasta) return;

      const refreshBtn = document.getElementById('refresh-btn');
      refreshBtn.disabled = true;
      const originalRefreshText = refreshBtn.textContent;
      if (forceRefresh) refreshBtn.textContent = '↻ Re-sincronizando...';

      const reportArea = document.getElementById('report-area');
      reportArea.innerHTML = `<div class="state-box"><span class="spinner-inline"></span>${forceRefresh ? 'Re-sincronizando histórico Meta + Kommo...' : 'Cargando...'}</div>`;

      try {
        const url = `${API_BASE}/api/reportes/dashboard?desde=${desde}&hasta=${hasta}&sync=${forceRefresh ? 'force' : 'auto'}`;
        const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
        if (r.status === 401) {
          sessionStorage.removeItem(TOKEN_KEY);
          location.replace('login.html');
          return;
        }
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error al obtener reporte');
        renderReport(data);
      } catch (err) {
        reportArea.innerHTML = `<div class="state-box error"><strong>Error:</strong> ${err.message}</div>`;
        document.getElementById('meta-footer').innerHTML = '';
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = originalRefreshText;
      }
    }

    function objectiveMeta(o) {
      if (o === 'OUTCOME_LEADS') return { label: 'Conversión', icon: 'C', cls: 'icon-leads' };
      if (o === 'OUTCOME_AWARENESS') return { label: 'Reconocimiento', icon: 'R', cls: 'icon-awareness' };
      if (o === 'OUTCOME_TRAFFIC' || o === 'LINK_CLICKS' || o === 'OUTCOME_ENGAGEMENT') return { label: 'Interacción', icon: 'I', cls: 'icon-traffic' };
      return { label: o, icon: '?', cls: 'icon-traffic' };
    }

    // Comparison delta vs previous period.
    // invert=true cuando un valor MENOR es mejor (ej: CPL).
    function deltaBadge(current, prev, opts = {}) {
      const invert = !!opts.invert;
      if (prev == null || prev === 0 || current == null) return '';
      const pct = ((current - prev) / Math.abs(prev)) * 100;
      const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '·';
      const isImprovement = invert ? pct < 0 : pct > 0;
      const cls = Math.abs(pct) < 0.05 ? 'delta-flat' : (isImprovement ? 'delta-up' : 'delta-down');
      return `<span class="card-delta ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}% vs período anterior</span>`;
    }

    function renderReport(data) {
      const t = data.meta.totals;
      const k = data.kommo;
      const d = data.derived;
      const campaigns = data.meta.campaigns.slice().sort((a, b) => b.spend - a.spend);

      // Headline metrics
      const hPrev = data.previous || {};

        <div class="headline-metric">

          <div class="value">${formatNum(t.leads)}</div>

        </div>
        <div class="headline-metric">
          <div class="label">Leads creados (Kommo)</div>

      const kommoFromMetaPct = t.leads > 0 ? ((k.created || 0) / t.leads) * 100 : 0;

      // Build grid

        <!-- Kommo funnel · al lado derecho del chart -->
        <div class="card span-4 row-span-2">
          <div class="card-title">
            Funnel Kommo
            <span class="pct" style="color: var(--teal);">${formatNum(k.created || 0)} leads</span>
          </div>
          <div class="breakdown-rows">
            <div class="br-row">
              <div class="br-icon blue">→</div>
              <div class="br-body">
                <div class="br-top">
                  <div class="br-name">Leads creados<br><span style="font-weight:500;color:var(--text-muted);font-size:0.72rem;">entran al CRM</span></div>
                  <div class="br-value">${formatNum(k.created || 0)}</div>
                </div>
                <div class="br-bottom">
                  <div class="br-meta">Inversión / leads creados</div>
                  <div class="br-cost">${d.cost_per_kommo_lead != null ? formatUSD2(d.cost_per_kommo_lead) : '—'}</div>
                </div>
              </div>
            </div>
            <div class="br-row">
              <div class="br-icon green">✓</div>
              <div class="br-body">
                <div class="br-top">
                  <div class="br-name">Leads derivados<br><span style="font-weight:500;color:var(--text-muted);font-size:0.72rem;">asignados a Tokko</span></div>
                  <div class="br-value">${formatNum(k.derived || 0)}</div>

                <div class="br-bottom">
                  <div class="br-meta">${formatPct(derivedPct)} del total</div>
                  <div class="br-cost">${d.cost_per_derived != null ? formatUSD2(d.cost_per_derived) : '—'}</div>
                </div>

            </div>
            <div class="br-row">
              <div class="br-icon warm">M</div>
              <div class="br-body">
                <div class="br-top">
                  <div class="br-name">Meta vs Kommo<br><span style="font-weight:500;color:var(--text-muted);font-size:0.72rem;">${formatNum(t.leads)} forms → ${formatNum(k.created || 0)} en CRM</span></div>
                  <div class="br-value">${formatPct(kommoFromMetaPct)}</div>
                </div>
                <div class="br-bottom">
                  <div class="br-meta">CPL Meta directo</div>
                  <div class="br-cost">${t.cost_per_lead != null ? formatUSD2(t.cost_per_lead) : '—'}</div>
                </div>
              </div>
            </div>

        </div>

        <!-- 4 metric cards en una fila: Alcance, ThruPlay, Visitas, Formularios -->
        <div class="card span-3 tint-blue">
          <div class="card-title" style="color: var(--primary);">Alcance · personas</div>
          <div class="card-value">${formatNum(t.reach)}</div>
          <div class="card-sub">${formatNum(t.impressions)} impresiones · CPM ${t.impressions > 0 ? formatUSD2((t.spend / t.impressions) * 1000) : '—'}</div>
          ${deltaBadge(t.reach, pt.reach)}
        </div>

        <div class="card span-3 tint-warm">
          <div class="card-title" style="color: var(--warm-strong);">ThruPlay (videos)</div>
          <div class="card-value">${formatNum(t.thruplays)}</div>
          <div class="card-sub">${t.cost_per_thruplay != null ? formatUSD2(t.cost_per_thruplay) + ' / thruplay' : '—'}</div>
          ${deltaBadge(t.thruplays, pt.thruplays)}
        </div>

        <div class="card span-3 tint-teal">
          <div class="card-title" style="color: var(--teal);">Visitas a la página</div>
          <div class="card-value">${formatNum(t.landing_page_views)}</div>
          <div class="card-sub">${t.cost_per_landing_page_view != null ? formatUSD2(t.cost_per_landing_page_view) + ' / visita' : '—'}</div>
          ${deltaBadge(t.landing_page_views, pt.landing_page_views)}
        </div>

        <div class="card span-3 dark">
          <div class="card-title">Formularios (Meta)</div>
          <div class="card-value">${formatNum(t.leads)}</div>
          <div class="card-sub muted">${t.cost_per_lead != null ? formatUSD2(t.cost_per_lead) + ' por lead' : '—'}</div>
          ${deltaBadge(t.leads, pt.leads)}
        </div>

        <!-- Inversión Meta with breakdown -->
        <div class="card span-9">
          <div class="card-title">
            Inversión Meta · distribución por campaña
            <span class="pct">${formatUSD2(t.spend)}</span>
          </div>
          <div class="card-value" style="font-size: 1.1rem; color: var(--text-muted); font-weight: 500; margin-bottom: 0.5rem;">
            ${campaigns.length} campañas activas
            ${deltaBadge(t.spend, pt.spend, { invert: false })}
          </div>
          <div class="progress-bars">${campaignBars || '<div class="card-sub">Sin datos en este período</div>'}</div>
        </div>

        <!-- Resumen card -->
        <div class="card span-3">
          <div class="card-title">Costo por lead Kommo</div>
          <div class="card-value">${d.cost_per_kommo_lead != null ? formatUSD2(d.cost_per_kommo_lead) : '—'}</div>
          <div class="card-sub">Inversión / leads creados</div>
          ${deltaBadge(d.cost_per_kommo_lead, pd.cost_per_kommo_lead, { invert: true })}
          <div style="margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border);">
            <div class="card-sub" style="margin-bottom: 0.25rem;">Costo por derivado</div>
            <div style="font-size: 1.2rem; font-weight: 700;">${d.cost_per_derived != null ? formatUSD2(d.cost_per_derived) : '—'}</div>
            ${deltaBadge(d.cost_per_derived, pd.cost_per_derived, { invert: true })}
          </div>
        </div>

        <!-- Campaign list -->
        <div class="card span-12">
          <div class="card-title">Campañas · detalle</div>
          <div class="campaign-list">
            ${campaigns.map((c) => {
              const meta = objectiveMeta(c.objective);
              return `
                <div class="campaign-item">
                  <div class="icon ${meta.cls}">${meta.icon}</div>
                  <div class="info">
                    <div class="name">${c.campaign_name}</div>
                    <div class="obj">${meta.label} · CTR ${formatPct(c.ctr)}</div>
                  </div>
                  <div class="num-cell">
                    <div class="num">${formatUSD2(c.spend)}</div>
                    <div class="lbl">Spend</div>
                  </div>
                  <div class="num-cell">
                    <div class="num">${formatNum(c.reach)}</div>
                    <div class="lbl">Alcance</div>
                  </div>
                  <div class="num-cell">
                    <div class="num">${(c.frequency || 0).toFixed(2)}</div>
                    <div class="lbl">Frecuencia</div>
                  </div>
                  <div class="num-cell">
                    <div class="num">${formatNum(c.leads || c.landing_page_views || c.thruplays)}</div>
                    <div class="lbl">${c.leads ? 'Leads' : c.landing_page_views ? 'Visitas' : 'ThruPlay'}</div>
                  </div>
                  <div class="num-cell">
                    <div class="num">${c.cost_per_lead != null ? formatUSD2(c.cost_per_lead) : c.cost_per_landing_page_view != null ? formatUSD2(c.cost_per_landing_page_view) : c.cost_per_thruplay != null ? formatUSD2(c.cost_per_thruplay) : '—'}</div>
                    <div class="lbl">Costo</div>
                  </div>
                </div>
              `;
            }).join('') || '<div class="card-sub">Sin campañas activas en este período</div>'}
            ${campaigns.length > 0 ? `
              <div class="campaign-item is-total">
                <div class="icon">Σ</div>
                <div class="info">
                  <div class="name">Total</div>
                  <div class="obj">${campaigns.length} campañas · CTR promedio ${formatPct(t.impressions > 0 ? (t.clicks / t.impressions) * 100 : 0)}</div>
                </div>
                <div class="num-cell">
                  <div class="num">${formatUSD2(t.spend)}</div>
                  <div class="lbl">Spend</div>
                </div>
                <div class="num-cell">
                  <div class="num">${formatNum(t.reach)}</div>
                  <div class="lbl">Alcance</div>
                </div>
                <div class="num-cell">
                  <div class="num">${t.reach > 0 ? (t.impressions / t.reach).toFixed(2) : '—'}</div>
                  <div class="lbl">Frecuencia</div>
                </div>
                <div class="num-cell">
                  <div class="num">${formatNum(t.leads)}</div>
                  <div class="lbl">Leads</div>
                </div>
                <div class="num-cell">
                  <div class="num">${t.cost_per_lead != null ? formatUSD2(t.cost_per_lead) : '—'}</div>
                  <div class="lbl">CPL</div>
                </div>
              </div>
            ` : ''}
          </div>
        </div>

        <!-- Forms breakdown -->
        <div class="card span-9">
          <div class="card-title">
            Formularios · distribución por grupo de anuncios
            <span class="pct">${formatNum(formsTotals.total)} leads</span>
          </div>
          <div class="card-value" style="font-size: 1.1rem; color: var(--text-muted); font-weight: 500; margin-bottom: 0.5rem;">
            ${formsBreakdown.length} grupo${formsBreakdown.length === 1 ? '' : 's'} de anuncios
          </div>
          <div class="progress-bars">${formBars || '<div class="card-sub">Sin leads de Meta Ads en este periodo</div>'}</div>
        </div>

        <!-- Forms NQ&RN split -->
        <div class="card span-3">
          <div class="card-title">Desglose NQ & RN</div>
          <div class="card-value">${formatNum(formsTotals.without_nq_rn)}</div>
          <div class="card-sub">Forms sin NQ & RN</div>
          <div style="margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border);">
            <div class="card-sub" style="margin-bottom: 0.25rem;">Forms con NQ & RN</div>
            <div style="font-size: 1.5rem; font-weight: 700;">${formatNum(formsTotals.with_nq_rn)}</div>
          </div>
        </div>
      `;

      // Footer meta
      const sm = data.meta.store_meta || {};
      document.getElementById('meta-footer').innerHTML = `
        <span>Período: <code>${data.desde}</code> → <code>${data.hasta}</code></span>
        <span>
          ${sm.last_synced_at ? `Histórico Meta sincronizado al ${new Date(sm.last_synced_at).toLocaleString('es-AR')}` : ''}
          ${sm.earliest && sm.latest ? ` · cubre <code>${sm.earliest}</code> → <code>${sm.latest}</code>` : ''}
        </span>
      `;

      // Chart
      lastReportData = data;
      renderEvolutionChart(data, seriesState);
      document.querySelectorAll('#chart-toggles .chart-toggle').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          seriesState[key] = !seriesState[key];
          btn.classList.toggle('active', seriesState[key]);
          const dot = btn.querySelector('.dot');
          dot.style.background = seriesState[key] ? btn.dataset.color : '';
          renderEvolutionChart(lastReportData, seriesState);

    let lastReportData = null;
    let currentUserName = '';
    const seriesState = {
      forms_count: true,
      forms_cost: false,
      derived_count: true,
      derived_cost: false,
    };

    function firstNameFromEmail(email) {
      const map = {
        'dev.federicocuellos@gmail.com': 'Federico',
        'tomasbadia.j@gmail.com': 'Tomás',
      };
      if (map[email]) return map[email];
      const local = (email || '').split('@')[0];
      const first = local.split(/[._]/)[0] || '';
      return first.charAt(0).toUpperCase() + first.slice(1);
    }

    function greetingForNow() {
      const h = new Date().getHours();
      if (h < 12) return 'Buen día';
      if (h < 19) return 'Buenas tardes';
      return 'Buenas noches';
    }

    let evolutionChart = null;
    function renderEvolutionChart(data, state) {
      const ctx = document.getElementById('evolution-chart');
      if (!ctx) return;

      // Date axis
      const dates = [];
      const start = new Date(data.desde + 'T12:00:00Z');
      const end = new Date(data.hasta + 'T12:00:00Z');
      for (let dt = new Date(start); dt <= end; dt.setUTCDate(dt.getUTCDate() + 1)) {
        dates.push(isoDate(dt));
      }

      const metaDaily = new Map((data.meta.daily || []).map((r) => [r.date, r]));
      const kommoDaily = new Map((data.kommo.daily || []).map((r) => [r.date, r]));
      const labels = dates.map((d) => new Date(d + 'T12:00:00Z').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }));

      const datasets = [];

      if (state.forms_count) {
        datasets.push({
          label: 'Formularios Meta',
          data: dates.map((d) => metaDaily.get(d)?.leads || 0),
          borderColor: '#057488',
          backgroundColor: 'rgba(5, 116, 136, 0.10)',
          yAxisID: 'y',
          tension: 0.35, fill: true, pointRadius: 2.5, pointHoverRadius: 5, borderWidth: 2.5,
        });
      }
      if (state.forms_cost) {
        datasets.push({
          label: 'Costo / formulario',
          data: dates.map((d) => {
            const m = metaDaily.get(d);
            return m && m.leads > 0 ? +(m.spend / m.leads).toFixed(2) : 0;
          }),
          borderColor: '#057488',
          borderDash: [5, 4],
          backgroundColor: 'transparent',
          yAxisID: 'y1',
          tension: 0.35, fill: false, pointRadius: 2, pointHoverRadius: 4, borderWidth: 2,
        });
      }
      if (state.derived_count) {
        datasets.push({
          label: 'Leads derivados',
          data: dates.map((d) => kommoDaily.get(d)?.derived || 0),
          borderColor: '#4a90e2',
          backgroundColor: 'rgba(74, 144, 226, 0.10)',
          yAxisID: 'y',
          tension: 0.35, fill: true, pointRadius: 2.5, pointHoverRadius: 5, borderWidth: 2.5,
        });
      }
      if (state.derived_cost) {
        datasets.push({
          label: 'Costo / derivado',
          data: dates.map((d) => {
            const m = metaDaily.get(d);
            const k = kommoDaily.get(d);
            const spend = m ? m.spend : 0;
            return k && k.derived > 0 ? +(spend / k.derived).toFixed(2) : 0;
          }),
          borderColor: '#4a90e2',
          borderDash: [5, 4],
          backgroundColor: 'transparent',
          yAxisID: 'y1',
          tension: 0.35, fill: false, pointRadius: 2, pointHoverRadius: 4, borderWidth: 2,
        });
      }

      const showCount = state.forms_count || state.derived_count;
      const showCost  = state.forms_cost || state.derived_cost;

      const cfg = {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const isCostSeries = ctx.dataset.yAxisID === 'y1';
                  const v = ctx.parsed.y;
                  const formatted = isCostSeries
                    ? '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    : Number(v).toLocaleString('es-AR');
                  return `${ctx.dataset.label}: ${formatted}`;
                },
              },
              backgroundColor: '#1a3a6e', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 8,
            },
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#6e7b96', font: { size: 10 }, maxRotation: 0, autoSkipPadding: 16 } },
            y: {
              display: showCount,
              beginAtZero: true, position: 'left',
              grid: { color: 'rgba(110, 123, 150, 0.08)' },
              ticks: {
                color: '#6e7b96', font: { size: 10 },
                callback: (v) => Number(v).toLocaleString('es-AR'),
              },
              title: { display: true, text: 'Cantidad', color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
            y1: {
              display: showCost,
              beginAtZero: true, position: 'right',
              grid: { drawOnChartArea: !showCount, color: 'rgba(110, 123, 150, 0.05)' },
              ticks: {
                color: '#6e7b96', font: { size: 10 },
                callback: (v) => '$' + Number(v).toFixed(2),
              },
              title: { display: true, text: 'USD', color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
          },
        },
      };

      if (evolutionChart) evolutionChart.destroy();
      evolutionChart = new Chart(ctx, cfg);
    }

    (async () => {
      const token = sessionStorage.getItem(TOKEN_KEY);
      if (!token) {
        location.replace('login.html');
        return;
      }
      try {
        const data = await verifyToken(token);
        currentUserName = firstNameFromEmail(data.email);
        document.getElementById('user-email').textContent = data.email;
        document.getElementById('user-avatar').textContent = (currentUserName[0] || data.email[0] || 'U').toUpperCase();
        document.getElementById('auth-loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        fetchReport();
      } catch (e) {
        sessionStorage.removeItem(TOKEN_KEY);
        location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
