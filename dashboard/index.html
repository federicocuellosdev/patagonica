<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Patagónica Propiedades</title>
  <link rel="icon" type="image/png" href="/mirador/img/patagonica-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://d1v2p1s05qqabi.cloudfront.net/fonts/patagonica/fonts-patagonica.css" rel="stylesheet">
  <style>
    :root {
      --primary: #121C25;
      --secondary: #057488;
      --light: #f7f7f7;
      --text: #2a2a2a;
      --text-muted: #6c757d;
      --border: #e4ddd4;
      --br: 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Gilroy, 'Source Sans Pro', sans-serif; color: var(--text); background: var(--light); line-height: 1.6; }

    header {
      background: var(--primary); color: #fff;
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    header img { height: 28px; }
    .user-bar { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: rgba(255,255,255,0.7); }
    .user-bar button {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.85);
      padding: 0.4rem 0.85rem; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.78rem;
    }
    .user-bar button:hover { background: rgba(255,255,255,0.08); }

    main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    h1 { font-family: Gilroy; font-weight: 400; font-size: 1.8rem; color: var(--primary); margin-bottom: 0.4rem; }
    .lead { color: var(--text-muted); margin-bottom: 2rem; }

    .placeholder {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 3rem 2rem; text-align: center; color: var(--text-muted);
    }
    .placeholder strong { display: block; color: var(--primary); font-size: 1.05rem; margin-bottom: 0.4rem; }

    .loading, .error {
      display: flex; align-items: center; justify-content: center; min-height: 60vh;
      flex-direction: column; gap: 1rem;
    }
    .error a { color: var(--secondary); }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--secondary);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Verificando acceso...</p>
  </div>

  <div id="error" class="error hidden">
    <p style="font-size: 1rem; color: var(--text);">El enlace expiró o no es válido.</p>
    <p><a href="login.html">Volver al login</a></p>
  </div>

  <div id="app" class="hidden">
    <header>
      <img src="/mirador/img/patagonica-logo-blanco.webp" alt="Patagónica Propiedades">
      <div class="user-bar">
        <span id="user-email"></span>
        <button id="logout-btn">Cerrar sesión</button>
      </div>
    </header>

    <main>
      <h1>Dashboard de reportes</h1>
      <p class="lead">Métricas de Meta Ads y Kommo por período.</p>

      <div class="placeholder">
        <strong>Reporte en construcción</strong>
        Próximamente: spend, alcance, lead forms, ThruPlay, visitas y costo por resultado, cruzados con leads de Kommo.
      </div>
    </main>
  </div>

  <script>
    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://patagonica.onrender.com';

    const TOKEN_KEY = 'patagonica_dashboard_token';

    function showError() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    }

    function showApp(email) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('user-email').textContent = email || '';
      document.getElementById('app').classList.remove('hidden');
    }

    async function verifyToken(token) {
      const r = await fetch(`${API_BASE}/api/auth/verify`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!r.ok) throw new Error('invalid');
      return r.json();
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem(TOKEN_KEY);
      location.href = 'login.html';
    });

    (async () => {
      const token = sessionStorage.getItem(TOKEN_KEY);
      if (!token) {
        location.replace('login.html');
        return;
      }
      try {
        const data = await verifyToken(token);
        showApp(data.email);
      } catch (e) {
        sessionStorage.removeItem(TOKEN_KEY);
        location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
