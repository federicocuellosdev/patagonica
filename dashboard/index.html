<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  // <base href="../"> siempre, asi los './' resuelven en file:// y https://
  (function() {
      document.write('<base href="../">');
      document.addEventListener('click', function(e) {
          var a = e.target.closest('a[href^="#"]');
          if (a) { e.preventDefault(); var el = document.getElementById(a.getAttribute('href').substring(1)); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
      });
  })();
  </script>
  <title>Dashboard | Patagónica Propiedades</title>
  <link rel="icon" type="image/png" href="./src/img/patagonica-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://d1v2p1s05qqabi.cloudfront.net/fonts/patagonica/fonts-patagonica.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:           #e7ebf3;
      --bg-2:         #f1f4f9;
      --card:         #ffffff;
      --primary:      #1a3a6e;
      --accent:       #4a90e2;
      --accent-soft:  #cfe1f5;
      --teal:         #057488;
      --teal-soft:    #d6eef1;
      --warm:         #f3e9d7;
      --warm-strong:  #d4a85a;
      --green-soft:   #d4ecdf;
      --green:        #3aa676;
      --rose-soft:    #f4dadf;
      --rose:         #c0526a;
      --text:         #1a3a6e;
      --text-muted:   #6e7b96;
      --text-soft:    #93a1bd;
      --border:       #e3e8ef;
      --br-card:      22px;
      --br-pill:      50px;
      --br-input:     14px;
      --shadow:       0 2px 14px rgba(26, 58, 110, 0.05);
      --shadow-lg:    0 4px 24px rgba(26, 58, 110, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      min-height: 100vh;
      padding: 1.25rem;
    }

    /* Shell */
    .shell {
      max-width: 1320px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 28px;
      padding: 1.5rem 1.75rem 2rem;
      box-shadow: var(--shadow);
    }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem; width: 100%;
    }
    .topbar .nav-pills { flex: 1; justify-content: center; }
    .topbar > .topbar-left,
    .topbar > .topbar-right { flex-shrink: 0; }
    .brand-pill {
      display: inline-flex; align-items: center; gap: 0.55rem;
      padding: 0.35rem 0.95rem 0.35rem 0.4rem;
      background: var(--bg-2); border-radius: var(--br-pill);
      font-weight: 600; font-size: 0.82rem; color: var(--text);
    }
    .brand-pill .dot {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--primary); display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 0.75rem;
    }
    .nav-pills {
      display: flex; gap: 0.3rem; padding: 0.3rem; background: var(--bg-2);
      border-radius: var(--br-pill);
    }
    .nav-pill {
      padding: 0.45rem 1rem; border-radius: var(--br-pill); font-size: 0.78rem;
      color: var(--text-muted); cursor: pointer; border: none; background: transparent;
      font-family: inherit; font-weight: 500; transition: all 0.15s;
    }
    .nav-pill.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(26, 58, 110, 0.2); }
    .nav-pill:not(.active):hover { color: var(--text); }
    .topbar-right { display: flex; align-items: center; gap: 0.6rem; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--card); cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--bg-2); }
    .user-chip {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.3rem 0.85rem 0.3rem 0.3rem;
      background: var(--bg-2); border-radius: var(--br-pill);
    }
    .user-chip .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700;
    }
    .user-chip .email { font-size: 0.78rem; color: var(--text); font-weight: 500; }
    .logout-link {
      font-size: 0.75rem; color: var(--text-muted); text-decoration: none; padding-left: 0.5rem;
      border-left: 1px solid var(--border); cursor: pointer;
    }
    .logout-link:hover { color: var(--rose); }

    /* Welcome */
    .welcome { margin-bottom: 1.5rem; }
    .welcome h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 700; font-size: 2.1rem; line-height: 1.15; color: var(--text);
      letter-spacing: -0.5px; margin-bottom: 0.35rem;
    }
    .welcome .lead { color: var(--text-muted); font-size: 0.92rem; }

    /* Headline metrics — fila horizontal de 4 KPIs */
    .headline-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      padding: 1.5rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .headline-metric { text-align: left; min-width: 0; padding: 0 0.5rem; border-right: 1px solid var(--border); }
    .headline-metric:last-child { border-right: none; }
    .headline-metric .label {
      font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.45rem;
      font-weight: 500; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .headline-metric .value {
      font-size: 2rem; font-weight: 700; line-height: 1; color: var(--text);
      letter-spacing: -0.8px;
    }

    /* Filters bar */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
      padding: 0.7rem 0.9rem; background: var(--bg-2); border-radius: var(--br-pill);
      margin-bottom: 1.5rem;
    }
    .filter-bar .preset-btn {
      padding: 0.45rem 1rem; border-radius: var(--br-pill); font-size: 0.78rem;
      color: var(--text-muted); cursor: pointer; border: none; background: transparent;
      font-family: inherit; font-weight: 500;
    }
    .filter-bar .preset-btn.active,
    .filter-bar .preset-btn:hover { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
    .filter-bar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 0.3rem; }
    .filter-bar .date-input {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.35rem 0.85rem; background: var(--card); border-radius: var(--br-pill);
      box-shadow: var(--shadow);
    }
    .filter-bar .date-input label { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
    .filter-bar .date-input input {
      border: none; background: transparent; font-family: inherit;
      font-size: 0.82rem; color: var(--text); font-weight: 500;
      outline: none; cursor: pointer; padding: 0;
    }
    .filter-bar .resync-btn {
      margin-left: auto; padding: 0.5rem 1rem; border-radius: var(--br-pill);
      background: var(--card); border: 1px solid var(--border);
      color: var(--text-muted); font-family: inherit; font-size: 0.78rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .filter-bar .resync-btn:hover { color: var(--teal); border-color: var(--teal); }
    .filter-bar .resync-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Grid (12 cols) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1rem;
    }
    .card {
      background: var(--card); border-radius: var(--br-card); padding: 1.25rem;
      border: 1px solid var(--border);
    }
    .card.span-3  { grid-column: span 3; }
    .card.span-4  { grid-column: span 4; }
    .card.span-8  { grid-column: span 8; }
    .card.span-9  { grid-column: span 9; }
    .card.span-12 { grid-column: span 12; }
    .card.row-span-2 { grid-row: span 2; }

    /* Delta indicator */
    .card-delta {
      font-size: 0.7rem; font-weight: 600; margin-top: 0.45rem;
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.2rem 0.55rem; border-radius: var(--br-pill);
      white-space: nowrap;
    }
    .delta-up    { background: var(--green-soft); color: var(--green); }
    .delta-down  { background: var(--rose-soft);  color: var(--rose); }
    .delta-flat  { background: var(--bg-2);       color: var(--text-muted); }
    .card.dark .card-delta {
      background: rgba(255,255,255,0.12);
    }
    .card.dark .delta-up { color: #7be0ad; }
    .card.dark .delta-down { color: #ff9aa8; }
    .card-tinted { color: var(--text); }
    .card.tint-blue { background: linear-gradient(135deg, #e8f1ff 0%, #cfe1f5 100%); border-color: transparent; }
    .card.tint-teal { background: linear-gradient(135deg, var(--teal-soft), #b9e0e4); border-color: transparent; }
    .card.tint-warm { background: linear-gradient(135deg, var(--warm), #ecdcb8); border-color: transparent; }
    .card.tint-green { background: linear-gradient(135deg, var(--green-soft), #b6dcc7); border-color: transparent; }
    .card.dark { background: var(--primary); color: #fff; border-color: transparent; }
    .card.dark .card-title,
    .card.dark .muted { color: rgba(255,255,255,0.7); }

    .card-title {
      font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
      margin-bottom: 0.65rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .card-title .pct {
      margin-left: auto;
      background: var(--card); color: var(--accent);
      font-size: 0.7rem; padding: 0.15rem 0.6rem; border-radius: var(--br-pill); font-weight: 700;
    }
    .card-value {
      font-size: 1.85rem; font-weight: 700; letter-spacing: -0.6px;
      line-height: 1; margin-bottom: 0.35rem;
    }
    .card-sub {
      font-size: 0.78rem; color: var(--text-muted);
    }

    /* Progress bars */
    .progress-bars { display: flex; flex-direction: column; gap: 1.15rem; margin-top: 1.25rem; }
    .progress-row { display: flex; align-items: center; gap: 0.85rem; font-size: 0.82rem; padding: 0.25rem 0; }
    .progress-row .name {
      width: 220px; color: var(--text-muted); font-weight: 500; flex-shrink: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .progress-row .bar {
      flex: 1; height: 32px; background: var(--bg-2); border-radius: var(--br-pill); overflow: hidden;
      position: relative;
    }
    .progress-row .bar-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      border-radius: var(--br-pill);
      display: flex; align-items: center; padding-left: 1rem;
      color: #fff; font-size: 0.76rem; font-weight: 700;
      min-width: 36px;
    }
    .bar-fill.blue { background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 100%); }
    .bar-fill.teal { background: linear-gradient(90deg, var(--teal) 0%, #044451 100%); }
    .bar-fill.warm { background: linear-gradient(90deg, var(--warm-strong) 0%, #8a6f33 100%); }
    .progress-row .pct-end { width: 50px; text-align: right; color: var(--text); font-weight: 600; }

    /* Campaign list */
    .campaign-list {
      display: flex; flex-direction: column;
    }
    .campaign-item {
      display: grid; grid-template-columns: 36px 1fr auto auto auto auto auto; gap: 2.25rem; align-items: center;
      padding: 0.85rem 0; border-bottom: 1px solid var(--border);
    }
    .campaign-item .num-cell { min-width: 84px; }
    .campaign-item .info .name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .campaign-item.is-total {
      border-top: 2px solid var(--primary);
      border-bottom: none;
      padding-top: 1.2rem; margin-top: 0.4rem;
    }
    .campaign-item.is-total .icon {
      background: var(--primary); color: #fff;
    }
    .campaign-item.is-total .info .name {
      font-size: 1rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .campaign-item.is-total .info .obj { color: var(--text-muted); }
    .campaign-item.is-total .num-cell .num {
      font-size: 1.08rem; font-weight: 700; color: var(--text);
    }
    .campaign-item.is-total .num-cell .lbl {
      font-weight: 700; color: var(--primary);
    }
    .campaign-item:last-child { border-bottom: none; }
    .campaign-item .icon {
      width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-weight: 700; font-size: 0.78rem;
    }
    .icon-leads { background: var(--teal-soft); color: var(--teal); }
    .icon-awareness { background: var(--warm); color: var(--warm-strong); }
    .icon-traffic { background: var(--accent-soft); color: var(--primary); }
    .campaign-item .info .name { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .campaign-item .info .obj { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; }
    .campaign-item .num-cell { text-align: right; min-width: 70px; }
    .campaign-item .num-cell .num { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .campaign-item .num-cell .lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.1rem; }

    /* Collapsible details (FAQ-style) */
    details.collapsible > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.25rem 0;
    }
    details.collapsible > summary::-webkit-details-marker { display: none; }
    details.collapsible > summary::after {
      content: '';
      width: 10px; height: 10px;
      border-right: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted);
      transform: rotate(-45deg);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    details.collapsible[open] > summary::after { transform: rotate(45deg); }
    details.collapsible > summary > .card-title {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    details.collapsible[open] > summary { margin-bottom: 0.75rem; }

    .ad-sort-group { display: inline-flex; gap: 0.25rem; }
    .ad-sort-btn {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      font-size: 0.7rem; font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-2);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      text-transform: none;
      letter-spacing: 0;
    }
    .ad-sort-btn:hover { background: var(--border); }
    .ad-sort-btn.active { background: var(--primary); color: #fff; }
    .ad-sort-divider {
      display: inline-block; width: 1px; height: 16px;
      background: var(--border); margin: 0 0.25rem; vertical-align: middle;
    }

    /* Onboarding-style breakdown */
    .breakdown-rows { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.85rem; }
    .br-row {
      display: grid; grid-template-columns: 32px 1fr; gap: 0.6rem; align-items: start;
      padding: 0.7rem 0.85rem; background: var(--bg-2); border-radius: 14px;
    }
    .br-row .br-body { display: flex; flex-direction: column; gap: 0.35rem; }
    .br-row .br-top {
      display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
    }
    .br-row .br-name { font-size: 0.84rem; font-weight: 600; color: var(--text); line-height: 1.25; }
    .br-row .br-value { font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1; flex-shrink: 0; }
    .br-row .br-bottom {
      display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
      padding-top: 0.35rem; border-top: 1px solid rgba(110,123,150,0.12);
    }
    .br-row .br-meta { font-size: 0.7rem; color: var(--text-muted); }
    .br-row .br-cost { font-size: 0.78rem; font-weight: 700; color: var(--teal); flex-shrink: 0; }
    .br-row .br-icon {
      width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .br-icon.blue { background: var(--accent-soft); color: var(--primary); }
    .br-icon.teal { background: var(--teal-soft); color: var(--teal); }
    .br-icon.green { background: var(--green-soft); color: var(--green); }
    .br-icon.warm { background: var(--warm); color: var(--warm-strong); }
    .br-icon.rose { background: var(--rose-soft); color: var(--rose); }
    .br-row .br-name { font-size: 0.86rem; font-weight: 600; color: var(--text); }
    .br-row .br-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; }
    .br-row .br-value { font-size: 0.92rem; font-weight: 700; color: var(--text); }

    /* Loading / states */
    .full-loading {
      display: flex; align-items: center; justify-content: center; min-height: 70vh;
      flex-direction: column; gap: 1rem;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .spinner-inline {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    .state-box {
      grid-column: 1 / -1;
      background: var(--bg-2); border-radius: var(--br-card); padding: 2.5rem; text-align: center;
      color: var(--text-muted); font-size: 0.92rem;
    }
    .state-box.error { background: var(--rose-soft); color: var(--rose); }

    .meta-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 1rem; margin-top: 1.5rem; border-top: 1px solid var(--border);
      font-size: 0.74rem; color: var(--text-soft);
    }
    .meta-footer code { background: var(--bg-2); padding: 0.1rem 0.45rem; border-radius: 4px; font-family: 'Inter', monospace; font-size: 0.95em; }

    /* Chart series toggles (multi-select chips) */
    .chart-toggles {
      display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.75rem;
    }
    .chart-toggle {
      padding: 0.4rem 0.85rem; border-radius: var(--br-pill);
      font-size: 0.74rem; color: var(--text-muted); cursor: pointer;
      border: 1px solid var(--border); background: var(--card);
      font-family: inherit; font-weight: 500;
      display: inline-flex; align-items: center; gap: 0.45rem;
      transition: all 0.15s;
    }
    .chart-toggle:hover { border-color: var(--text-soft); }
    .chart-toggle .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--border); transition: background 0.15s;
      flex-shrink: 0;
    }
    .chart-toggle.active {
      background: var(--bg-2); color: var(--text); border-color: transparent;
    }

    .chart-wrap { position: relative; height: 280px; margin-top: 0.85rem; }

    @media (max-width: 1100px) {
      .dashboard-grid { grid-template-columns: repeat(6, 1fr); }
      .card.span-3 { grid-column: span 3; }
      .card.span-4, .card.span-8, .card.span-9, .card.span-12 { grid-column: span 6; }
      .card.row-span-2 { grid-row: span 1; }
    }
    @media (max-width: 960px) {
      .headline-metrics { grid-template-columns: repeat(2, 1fr); }
      .headline-metric:nth-child(2) { border-right: none; }
    }
    @media (max-width: 640px) {
      body { padding: 0.5rem; }
      .shell { padding: 1rem; border-radius: 18px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .card.span-3, .card.span-4, .card.span-8, .card.span-9, .card.span-12 { grid-column: span 1; }
      .topbar { flex-wrap: wrap; }
    }

    /* Detail modal con chart por entidad */
    .progress-row, .campaign-item:not(.is-total) { cursor: pointer; transition: background 0.15s ease; }
    .progress-row:hover { background: rgba(5, 116, 136, 0.04); border-radius: 8px; }
    .campaign-item:not(.is-total):hover { background: rgba(5, 116, 136, 0.04); }
    .entity-modal {
      position: fixed; inset: 0; z-index: 3000;
      background: rgba(18, 28, 37, 0.65);
      display: none; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .entity-modal.open { display: flex; }
    .entity-modal-card {
      background: #ffffff; border-radius: 18px;
      max-width: 960px; width: 100%; max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .entity-modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    }
    .entity-modal-title {
      font-size: 1.05rem; font-weight: 700; color: var(--primary);
      margin-bottom: 0.25rem;
    }
    .entity-modal-sub { font-size: 0.8rem; color: var(--text-muted); }
    .entity-modal-close {
      background: var(--bg-2); border: none; width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }
    .entity-modal-close:hover { background: var(--border); color: var(--primary); }
    .entity-modal-toggles {
      display: flex; gap: 0.5rem; padding: 0.85rem 1.5rem; flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .entity-modal-toggle {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 50px; padding: 0.4rem 0.85rem;
      font-size: 0.78rem; font-weight: 500; color: var(--text-muted);
      cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;
      transition: all 0.2s ease;
    }
    .entity-modal-toggle.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .entity-modal-toggle .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted);
    }
    .entity-modal-toggle.active .dot { background: #fff; }
    .entity-modal-body { padding: 1.25rem 1.5rem; flex: 1; overflow: auto; }
    .entity-modal-chart-wrap { height: 360px; }
    .entity-modal-stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem;
      margin-top: 1rem;
    }
    .entity-stat {
      background: var(--bg-2); padding: 0.75rem 0.85rem; border-radius: 12px;
    }
    .entity-stat .lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .entity-stat .val { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-top: 0.2rem; }
    @media (max-width: 640px) {
      .entity-modal-stats { grid-template-columns: repeat(2, 1fr); }
      .entity-modal-chart-wrap { height: 260px; }
    }
  </style>
</head>
<body>

  <div id="auth-loading" class="full-loading">
    <div class="spinner"></div>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Verificando acceso...</p>
  </div>

  <div id="app" class="hidden">
    <div class="shell">


      <!-- Welcome -->
      <div class="welcome">
        <h1 id="welcome-title">Hola</h1>
        <p class="lead" id="welcome-lead">Performance de Meta Ads y leads de Kommo en el período seleccionado.</p>
      </div>

      <!-- Headline metrics: 4 KPIs horizontales -->
      <div class="headline-metrics" id="headline-metrics"></div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <button class="preset-btn" data-range="7">Últ. 7 días</button>
        <button class="preset-btn active" data-range="30">Últ. 30 días</button>
        <button class="preset-btn" data-range="month">Este mes</button>
        <button class="preset-btn" data-range="lastmonth">Mes anterior</button>
        <button class="preset-btn" data-range="ytd">Este año</button>
        <span class="sep"></span>
        <span class="date-input">
          <label>Desde</label>
          <input type="date" id="desde">
        </span>
        <span class="date-input">
          <label>Hasta</label>
          <input type="date" id="hasta">
        </span>
        <button class="resync-btn" id="refresh-btn">↻ Re-sync histórico</button>
      </div>

      <!-- Grid -->
      <div class="dashboard-grid" id="report-area">
        <div class="state-box"><span class="spinner-inline"></span> Cargando...</div>
      </div>

      <div class="meta-footer" id="meta-footer"></div>
    </div>
  </div>

  <!-- Detail modal con chart por entidad -->
  <div class="entity-modal" id="entity-modal" role="dialog" aria-modal="true">
    <div class="entity-modal-card">
      <div class="entity-modal-header">
        <div>
          <div class="entity-modal-title" id="entity-modal-title">—</div>
          <div class="entity-modal-sub" id="entity-modal-sub">—</div>
        </div>
        <button class="entity-modal-close" id="entity-modal-close" aria-label="Cerrar">✕</button>
      </div>
      <div class="entity-modal-toggles" id="entity-modal-toggles"></div>
      <div class="entity-modal-body">
        <div class="entity-modal-chart-wrap"><canvas id="entity-modal-chart"></canvas></div>
        <div class="entity-modal-stats" id="entity-modal-stats"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://patagonica.onrender.com';
    const TOKEN_KEY = 'patagonica_dashboard_token';

    async function verifyToken(token) {
      const r = await fetch(`${API_BASE}/api/auth/verify`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!r.ok) throw new Error('invalid');
      return r.json();
    }

    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem(TOKEN_KEY);
      location.href = 'dashboard/login.html';
    });

    function formatUSD(n) { if (n == null || isNaN(n)) return '—'; return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: n < 100 ? 2 : 0 }); }
    function formatUSD2(n) { if (n == null || isNaN(n)) return '—'; return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function formatNum(n) { if (n == null || isNaN(n)) return '—'; return Number(n).toLocaleString('es-AR'); }
    function formatPct(n) { if (n == null || isNaN(n)) return '—'; return Number(n).toFixed(2) + '%'; }
    function pad(n) { return String(n).padStart(2, '0'); }
    function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

    function applyPreset(kind) {
      const today = new Date();
      let desde, hasta;
      if (kind === '7' || kind === '30') {
        const days = parseInt(kind);
        hasta = new Date(today);
        desde = new Date(today);
        desde.setDate(desde.getDate() - (days - 1));
      } else if (kind === 'month') {
        desde = new Date(today.getFullYear(), today.getMonth(), 1);
        hasta = new Date(today);
      } else if (kind === 'lastmonth') {
        desde = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        hasta = new Date(today.getFullYear(), today.getMonth(), 0);
      } else if (kind === 'ytd') {
        desde = new Date(today.getFullYear(), 0, 1);
        hasta = new Date(today);
      }
      document.getElementById('desde').value = isoDate(desde);
      document.getElementById('hasta').value = isoDate(hasta);
      document.querySelectorAll('.preset-btn').forEach((b) => b.classList.toggle('active', b.dataset.range === kind));
    }

    document.querySelectorAll('.preset-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        applyPreset(btn.dataset.range);
        fetchReport(false);
      });
    });
    document.getElementById('desde').addEventListener('change', () => {
      document.querySelectorAll('.preset-btn').forEach((b) => b.classList.remove('active'));
      fetchReport(false);
    });
    document.getElementById('hasta').addEventListener('change', () => {
      document.querySelectorAll('.preset-btn').forEach((b) => b.classList.remove('active'));
      fetchReport(false);
    });
    document.getElementById('refresh-btn').addEventListener('click', () => fetchReport(true));

    applyPreset('30');

    async function fetchReport(forceRefresh = false) {
      const token = sessionStorage.getItem(TOKEN_KEY);
      const desde = document.getElementById('desde').value;
      const hasta = document.getElementById('hasta').value;
      if (!desde || !hasta) return;

      const refreshBtn = document.getElementById('refresh-btn');
      refreshBtn.disabled = true;
      const originalRefreshText = refreshBtn.textContent;
      if (forceRefresh) refreshBtn.textContent = '↻ Re-sincronizando...';

      const reportArea = document.getElementById('report-area');
      reportArea.innerHTML = `<div class="state-box"><span class="spinner-inline"></span>${forceRefresh ? 'Re-sincronizando histórico Meta + Kommo...' : 'Cargando...'}</div>`;

      try {
        const url = `${API_BASE}/api/reportes/dashboard?desde=${desde}&hasta=${hasta}&sync=${forceRefresh ? 'force' : 'auto'}`;
        const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
        if (r.status === 401) {
          sessionStorage.removeItem(TOKEN_KEY);
          location.replace('dashboard/login.html');
          return;
        }
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error al obtener reporte');
        renderReport(data);
      } catch (err) {
        reportArea.innerHTML = `<div class="state-box error"><strong>Error:</strong> ${err.message}</div>`;
        document.getElementById('meta-footer').innerHTML = '';
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = originalRefreshText;
      }
    }

    function objectiveMeta(o) {
      if (o === 'OUTCOME_LEADS') return { label: 'Conversión', icon: 'C', cls: 'icon-leads' };
      if (o === 'OUTCOME_AWARENESS') return { label: 'Reconocimiento', icon: 'R', cls: 'icon-awareness' };
      if (o === 'OUTCOME_TRAFFIC' || o === 'LINK_CLICKS' || o === 'OUTCOME_ENGAGEMENT') return { label: 'Interacción', icon: 'I', cls: 'icon-traffic' };
      return { label: o, icon: '?', cls: 'icon-traffic' };
    }

    // Comparison delta vs previous period.
    // invert=true cuando un valor MENOR es mejor (ej: CPL).
    function deltaBadge(current, prev, opts = {}) {
      const invert = !!opts.invert;
      if (prev == null || prev === 0 || current == null) return '';
      const pct = ((current - prev) / Math.abs(prev)) * 100;
      const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '·';
      const isImprovement = invert ? pct < 0 : pct > 0;
      const cls = Math.abs(pct) < 0.05 ? 'delta-flat' : (isImprovement ? 'delta-up' : 'delta-down');
      return `<span class="card-delta ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}% vs período anterior</span>`;
    }

    function renderReport(data) {
      const t = data.meta.totals;
      const k = data.kommo;
      const d = data.derived;
      const campaigns = data.meta.campaigns.slice().sort((a, b) => b.spend - a.spend);

      // Headline metrics
      const hPrev = data.previous || {};
      const hPt = (hPrev.meta && hPrev.meta.totals) || {};
      const hPk = hPrev.kommo || {};
      const hPd = hPrev.derived || {};
      document.getElementById('headline-metrics').innerHTML = `
        <div class="headline-metric">
          <div class="label">Inversión</div>
          <div class="value">${formatUSD(t.spend)}</div>
          ${deltaBadge(t.spend, hPt.spend)}
        </div>
        <div class="headline-metric">
          <div class="label">Formularios (Meta)</div>
          <div class="value">${formatNum(t.leads)}</div>
          ${deltaBadge(t.leads, hPt.leads)}
        </div>
        <div class="headline-metric">
          <div class="label">Leads creados (Kommo)</div>
          <div class="value">${formatNum(k.created || 0)}</div>
          ${deltaBadge(k.created || 0, hPk.created)}
        </div>
        <div class="headline-metric">
          <div class="label">Costo / lead</div>
          <div class="value">${d.cost_per_kommo_lead != null ? formatUSD2(d.cost_per_kommo_lead) : '—'}</div>
          ${deltaBadge(d.cost_per_kommo_lead, hPd.cost_per_kommo_lead, { invert: true })}
        </div>
      `;

      // Welcome subtitle (saludo dinámico según la hora + nombre del usuario)
      document.getElementById('welcome-title').textContent = `${greetingForNow()}, ${currentUserName || ''}`.trim().replace(/,\s*$/, '');

      // Form adsets — todos los adsets de campañas cuyo nombre arranca con 'FORM - '
      // (incluye los que no llevan 'FORM -' en el adset_name)
      const allAdsets = (data.meta.adsets || []).slice();
      const formAdsets = allAdsets
        .filter((a) => (a.campaign_name || '').startsWith('FORM - ') || (a.adset_name || '').startsWith('FORM - '))
        .sort((a, b) => b.spend - a.spend);
      const formAdsetsTotals = formAdsets.reduce(
        (acc, a) => {
          acc.spend += a.spend;
          acc.reach += a.reach;
          acc.impressions += a.impressions;
          acc.clicks += a.clicks;
          acc.leads += a.leads;
          return acc;
        },
        { spend: 0, reach: 0, impressions: 0, clicks: 0, leads: 0 }
      );
      // Split de spend y leads por categoria (NQ&RN vs general)
      const formAdsetsSplit = formAdsets.reduce(
        (acc, a) => {
          const isNqRn = /NQ\s*&\s*RN/i.test(a.adset_name);
          const key = isNqRn ? 'nqRn' : 'general';
          acc[key].spend += a.spend;
          acc[key].leads += a.leads;
          return acc;
        },
        { general: { spend: 0, leads: 0 }, nqRn: { spend: 0, leads: 0 } }
      );
      const cplGeneral = formAdsetsSplit.general.leads > 0 ? formAdsetsSplit.general.spend / formAdsetsSplit.general.leads : null;
      const cplNqRn = formAdsetsSplit.nqRn.leads > 0 ? formAdsetsSplit.nqRn.spend / formAdsetsSplit.nqRn.leads : null;

      // Top FORM historico (toda la historia, no solo el periodo seleccionado)
      const allAdsHistoric = (data.meta.ads_all_time || data.meta.ads || []).slice();
      const baseFormAds = allAdsHistoric.filter((a) => (a.campaign_name || '').startsWith('FORM - '));
      function isAdActive(a) { return (a.effective_status || '').toUpperCase() === 'ACTIVE'; }
      function sortFormAds(key, onlyActive) {
        const base = onlyActive ? baseFormAds.filter(isAdActive) : baseFormAds;
        if (key === 'newest') return [...base].sort((a, b) => (b.created_time || '').localeCompare(a.created_time || ''));
        if (key === 'oldest') return [...base].sort((a, b) => (a.created_time || '').localeCompare(b.created_time || ''));
        return [...base].sort((a, b) => b.leads - a.leads);
      }
      let topAdsSort = window.__topAdsSort || 'result';
      let topAdsOnlyActive = window.__topAdsOnlyActive === true;
      let topAds = sortFormAds(topAdsSort, topAdsOnlyActive).slice(0, 20);
      function adRowHTML(a) {
        return `
          <div class="campaign-item" data-entity-type="ad" data-entity-id="${a.ad_id}">
            <div class="icon icon-leads">A</div>
            <div class="info">
              <div class="name" title="${a.ad_name}">${a.ad_name}</div>
              <div class="obj">${a.adset_name} · ${statusBadge(a.effective_status)}</div>
            </div>
            <div class="num-cell"><div class="num">${formatNum(a.leads)}</div><div class="lbl">Leads</div></div>
            <div class="num-cell"><div class="num">${a.cost_per_lead != null ? formatUSD2(a.cost_per_lead) : '—'}</div><div class="lbl">CPL</div></div>
            <div class="num-cell"><div class="num">${formatUSD2(a.spend)}</div><div class="lbl">Inversión</div></div>
            <div class="num-cell"><div class="num">${fmtCreated(a.created_time)}</div><div class="lbl">Publicado</div></div>
          </div>
        `;
      }
      function statusBadge(s) {
        const st = (s || '').toUpperCase();
        if (st === 'ACTIVE') return '<span style="color:#1d8b4f;font-weight:600;">● Activo</span>';
        if (st.includes('PAUSE')) return '<span style="color:#9a6b1a;font-weight:600;">● Pausado</span>';
        return `<span style="color:var(--text-muted);">${s || '—'}</span>`;
      }
      function fmtCreated(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: '2-digit' });
      }

      // Distribucion por grupo de anuncios (Meta adsets, no Kommo)
      const totalFormAdsetLeads = formAdsets.reduce((s, a) => s + (a.leads || 0), 0) || 1;
      const formBars = formAdsets.map((a) => {
        const pct = (a.leads / totalFormAdsetLeads) * 100;
        const short = a.adset_name.replace(/^FORM - /, '');
        return `
          <div class="progress-row" data-entity-type="adset" data-entity-id="${a.adset_id}">
            <div class="name" title="${a.adset_name}">${short}</div>
            <div class="bar"><div class="bar-fill teal" style="width: ${pct.toFixed(1)}%;">${pct.toFixed(0)}%</div></div>
            <div class="pct-end">${formatNum(a.leads)} leads</div>
          </div>
        `;
      }).join('');

      // Spend share by campaign for progress bars
      const totalSpend = t.spend || 1;
      const campaignBars = campaigns.map((c) => {
        const pct = (c.spend / totalSpend) * 100;
        const cls = c.objective === 'OUTCOME_LEADS' ? 'teal'
                  : c.objective === 'OUTCOME_AWARENESS' ? 'warm' : 'blue';
        const short = c.campaign_name.replace(/^FORM - |^TRAFICO - |^RM - /, '');
        return `
          <div class="progress-row" data-entity-type="campaign" data-entity-id="${c.campaign_id}">
            <div class="name" title="${c.campaign_name}">${short}</div>
            <div class="bar"><div class="bar-fill ${cls}" style="width: ${pct.toFixed(1)}%;">${pct.toFixed(0)}%</div></div>
            <div class="pct-end">${formatUSD2(c.spend)}</div>
          </div>
        `;
      }).join('');

      // Visitas/leads ratio
      const conversionPct = t.landing_page_views > 0 ? (t.leads / t.landing_page_views) * 100 : 0;
      const kommoFromMetaPct = t.leads > 0 ? ((k.created || 0) / t.leads) * 100 : 0;
      const derivedPct = (k.created || 0) > 0 ? ((k.derived || 0) / k.created) * 100 : 0;

      // Previous period totals para deltas
      const prev = data.previous || {};
      const pt = (prev.meta && prev.meta.totals) || {};
      const pk = prev.kommo || {};
      const pd = prev.derived || {};

      // Build grid
      document.getElementById('report-area').innerHTML = `
        <!-- LINE CHART · formularios + derivados -->
        <div class="card span-8 row-span-2">
          <div class="card-title">Evolución diaria</div>
          <div class="chart-toggles" id="chart-toggles">
            <button class="chart-toggle active" data-key="forms_count" data-color="#057488" data-axis="y">
              <span class="dot" style="background:#057488;"></span>Formularios Meta
            </button>
            <button class="chart-toggle" data-key="forms_cost" data-color="#057488" data-axis="y1">
              <span class="dot"></span>Costo / formulario
            </button>
            <button class="chart-toggle active" data-key="derived_count" data-color="#4a90e2" data-axis="y">
              <span class="dot" style="background:#4a90e2;"></span>Leads derivados
            </button>
            <button class="chart-toggle" data-key="derived_cost" data-color="#4a90e2" data-axis="y1">
              <span class="dot"></span>Costo / derivado
            </button>
            <button class="chart-toggle" data-key="hitos" data-color="#c0392b" data-axis="hito">
              <span class="dot"></span>Hitos
            </button>
          </div>
          <div class="chart-wrap"><canvas id="evolution-chart"></canvas></div>
        </div>

        <!-- Kommo funnel · al lado derecho del chart -->
        <div class="card span-4 row-span-2">
          <div class="card-title">
            Funnel Kommo
            <span class="pct" style="color: var(--teal);">${formatNum(k.created || 0)} leads</span>
          </div>
          <div class="breakdown-rows">
            <div class="br-row">
              <div class="br-icon blue">→</div>
              <div class="br-body">
                <div class="br-top">
                  <div class="br-name">Leads creados<br><span style="font-weight:500;color:var(--text-muted);font-size:0.72rem;">entran al CRM</span></div>
                  <div class="br-value">${formatNum(k.created || 0)}</div>
                </div>
                <div class="br-bottom">
                  <div class="br-meta">Inversión / leads creados</div>
                  <div class="br-cost">${d.cost_per_kommo_lead != null ? formatUSD2(d.cost_per_kommo_lead) : '—'}</div>
                </div>
              </div>
            </div>
            <div class="br-row">
              <div class="br-icon green">✓</div>
              <div class="br-body">
                <div class="br-top">
                  <div class="br-name">Leads derivados<br><span style="font-weight:500;color:var(--text-muted);font-size:0.72rem;">asignados a Tokko</span></div>
                  <div class="br-value">${formatNum(k.derived || 0)}</div>
                </div>
                <div class="br-bottom">
                  <div class="br-meta">${formatPct(derivedPct)} del total</div>
                  <div class="br-cost">${d.cost_per_derived != null ? formatUSD2(d.cost_per_derived) : '—'}</div>
                </div>
              </div>
            </div>
            <div class="br-row">
              <div class="br-icon warm">M</div>
              <div class="br-body">
                <div class="br-top">
                  <div class="br-name">Meta vs Kommo<br><span style="font-weight:500;color:var(--text-muted);font-size:0.72rem;">${formatNum(t.leads)} forms → ${formatNum(k.created || 0)} en CRM</span></div>
                  <div class="br-value">${formatPct(kommoFromMetaPct)}</div>
                </div>
                <div class="br-bottom">
                  <div class="br-meta">CPL Meta directo</div>
                  <div class="br-cost">${t.cost_per_lead != null ? formatUSD2(t.cost_per_lead) : '—'}</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 4 metric cards en una fila: Alcance, ThruPlay, Visitas, Formularios -->
        <div class="card span-3 tint-blue">
          <div class="card-title" style="color: var(--primary);">Alcance · personas</div>
          <div class="card-value">${formatNum(t.reach)}</div>
          <div class="card-sub">${formatNum(t.impressions)} impresiones · CPM ${t.impressions > 0 ? formatUSD2((t.spend / t.impressions) * 1000) : '—'}</div>
          ${deltaBadge(t.reach, pt.reach)}
        </div>

        <div class="card span-3 tint-warm">
          <div class="card-title" style="color: var(--warm-strong);">ThruPlay (videos)</div>
          <div class="card-value">${formatNum(t.thruplays)}</div>
          <div class="card-sub">${t.cost_per_thruplay != null ? formatUSD2(t.cost_per_thruplay) + ' / thruplay' : '—'}</div>
          ${deltaBadge(t.thruplays, pt.thruplays)}
        </div>

        <div class="card span-3 tint-teal">
          <div class="card-title" style="color: var(--teal);">Visitas a la página</div>
          <div class="card-value">${formatNum(t.landing_page_views)}</div>
          <div class="card-sub">${t.cost_per_landing_page_view != null ? formatUSD2(t.cost_per_landing_page_view) + ' / visita' : '—'}</div>
          ${deltaBadge(t.landing_page_views, pt.landing_page_views)}
        </div>

        <div class="card span-3 dark">
          <div class="card-title">Formularios (Meta)</div>
          <div class="card-value">${formatNum(t.leads)}</div>
          <div class="card-sub muted">${t.cost_per_lead != null ? formatUSD2(t.cost_per_lead) + ' por lead' : '—'}</div>

    // ===== Modal: timeline de ads FORM por fecha de publicacion =====
    const timelineState = { leads: true, cpl: true, spend: false };

    function openAdsTimelineModal(ads) {
      const valid = ads.filter((a) => a.created_time);
      if (!valid.length) return;
      document.getElementById('entity-modal-title').textContent = 'Anuncios FORM · línea de tiempo';
      document.getElementById('entity-modal-sub').textContent = `${valid.length} anuncio${valid.length===1?'':'s'} ubicado${valid.length===1?'':'s'} en su fecha de publicación`;

      document.getElementById('entity-modal-toggles').innerHTML = `
        <button class="entity-modal-toggle ${timelineState.leads ? 'active' : ''}" data-key="leads"><span class="dot"></span>Leads</button>
        <button class="entity-modal-toggle ${timelineState.cpl ? 'active' : ''}" data-key="cpl"><span class="dot"></span>CPL (USD)</button>
        <button class="entity-modal-toggle ${timelineState.spend ? 'active' : ''}" data-key="spend"><span class="dot"></span>Inversión (USD)</button>
      `;
      document.querySelectorAll('#entity-modal-toggles .entity-modal-toggle').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          timelineState[key] = !timelineState[key];
          btn.classList.toggle('active', timelineState[key]);
          renderAdsTimelineChart(valid);
        });
      });

      const totalLeads = valid.reduce((s, a) => s + (a.leads || 0), 0);
      const totalSpend = valid.reduce((s, a) => s + (a.spend || 0), 0);
      const avgCpl = totalLeads > 0 ? totalSpend / totalLeads : null;
      document.getElementById('entity-modal-stats').innerHTML = `
        <div class="entity-stat"><div class="lbl">Anuncios</div><div class="val">${formatNum(valid.length)}</div></div>
        <div class="entity-stat"><div class="lbl">Leads totales</div><div class="val">${formatNum(totalLeads)}</div></div>
        <div class="entity-stat"><div class="lbl">Inversión total</div><div class="val">${formatUSD2(totalSpend)}</div></div>
        <div class="entity-stat"><div class="lbl">CPL promedio</div><div class="val">${avgCpl != null ? formatUSD2(avgCpl) : '—'}</div></div>
      `;

      document.getElementById('entity-modal').classList.add('open');
      document.body.style.overflow = 'hidden';
      renderAdsTimelineChart(valid);
    }

    function renderAdsTimelineChart(ads) {
      const ctx = document.getElementById('entity-modal-chart');
      if (!ctx) return;
      const sorted = [...ads].sort((a, b) => (a.created_time || '').localeCompare(b.created_time || ''));
      const datasets = [];
      if (timelineState.leads) {
        datasets.push({
          label: 'Leads',
          data: sorted.map((a) => ({ x: new Date(a.created_time).getTime(), y: a.leads || 0, ad: a })),
          backgroundColor: '#057488', borderColor: '#057488',
          yAxisID: 'y', pointRadius: 5, pointHoverRadius: 8, showLine: false,
        });
      }
      if (timelineState.cpl) {
        datasets.push({
          label: 'CPL',
          data: sorted.filter((a) => a.cost_per_lead != null).map((a) => ({ x: new Date(a.created_time).getTime(), y: +a.cost_per_lead.toFixed(2), ad: a })),
          backgroundColor: '#c0392b', borderColor: '#c0392b',
          yAxisID: 'y1', pointRadius: 5, pointHoverRadius: 8, pointStyle: 'triangle', showLine: false,
        });
      }
      if (timelineState.spend) {
        datasets.push({
          label: 'Inversión',
          data: sorted.map((a) => ({ x: new Date(a.created_time).getTime(), y: +a.spend.toFixed(2), ad: a })),
          backgroundColor: '#4a90e2', borderColor: '#4a90e2',
          yAxisID: 'y1', pointRadius: 5, pointHoverRadius: 8, pointStyle: 'rect', showLine: false,
        });
      }

      if (entityChart) entityChart.destroy();
      entityChart = new Chart(ctx, {
        type: 'scatter',
        data: { datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'nearest', intersect: true },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: (items) => {
                  const x = items[0]?.parsed?.x;
                  return x ? new Date(x).toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
                },
                label: (c) => {
                  const point = c.raw;
                  const v = c.parsed.y;
                  const isCurrency = c.dataset.yAxisID === 'y1';
                  const fv = isCurrency ? '$' + v.toFixed(2) : v.toLocaleString('es-AR');
                  const adName = point?.ad?.ad_name ? ' · ' + point.ad.ad_name : '';
                  return `${c.dataset.label}: ${fv}${adName}`;
                },
              },
              backgroundColor: '#1a3a6e', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 8,
            },
          },
          scales: {
            x: {
              type: 'linear', grid: { display: false },
              ticks: {
                color: '#6e7b96', font: { size: 10 }, maxRotation: 0, autoSkipPadding: 24,
                callback: (v) => new Date(v).toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: '2-digit' }),
              },
            },
            y: {
              display: timelineState.leads, beginAtZero: true, position: 'left',
              grid: { color: 'rgba(110,123,150,0.08)' },
              ticks: { color: '#6e7b96', font: { size: 10 }, callback: (v) => Number(v).toLocaleString('es-AR') },
              title: { display: true, text: 'Leads', color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
            y1: {
              display: timelineState.cpl || timelineState.spend, beginAtZero: true, position: 'right',
              grid: { drawOnChartArea: !timelineState.leads, color: 'rgba(110,123,150,0.05)' },
              ticks: { color: '#6e7b96', font: { size: 10 }, callback: (v) => '$' + Number(v).toFixed(2) },
              title: { display: true, text: 'USD', color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
          },
        },
      });
    }

    // ===== Modal con chart de evolución por entidad (campaign / adset) =====
    let entityChart = null;
    const entityModalState = { spend: true, result: true };

    function objectiveResultLabel(objective) {
      if (objective === 'OUTCOME_LEADS') return 'Leads';
      if (objective === 'OUTCOME_TRAFFIC') return 'Visitas';
      if (objective === 'OUTCOME_AWARENESS') return 'ThruPlay';
      return 'Resultados';
    }
    function resultKeyForEntity(entity) {
      // Adsets de FORM = leads. Campañas usan su objetivo.
      if (entity.adset_id) return 'leads';
      if (entity.objective === 'OUTCOME_TRAFFIC') return 'landing_page_views';
      if (entity.objective === 'OUTCOME_AWARENESS') return 'thruplays';
      return 'leads';
    }
    function resultLabelForEntity(entity) {
      if (entity.adset_id) return 'Leads';
      return objectiveResultLabel(entity.objective);
    }

    function openEntityModal(type, id) {
      if (!lastReportData) return;
      let entity = null;
      if (type === 'campaign') {
        entity = lastReportData.meta.campaigns.find((c) => String(c.campaign_id) === String(id));
      } else if (type === 'adset') {
        entity = (lastReportData.meta.adsets || []).find((a) => String(a.adset_id) === String(id));
      } else if (type === 'ad') {
        entity = (lastReportData.meta.ads || []).find((a) => String(a.ad_id) === String(id));
      } else if (type === 'form') {
        const fb = (lastReportData.kommo.forms_breakdown || []).find((f) => f.form_name === id);
        if (fb) {
          entity = {
            __form: true,
            form_name: fb.form_name,
            leads: fb.leads,
            derived: fb.derived,
            with_nq_rn: fb.with_nq_rn,
            without_nq_rn: fb.without_nq_rn,
            daily: fb.daily || [],
          };
        }
      }
      if (!entity) return;

      const modal = document.getElementById('entity-modal');
      let title, sub;
      if (type === 'campaign') {
        title = entity.campaign_name;
        sub = `Campaña · ${objectiveResultLabel(entity.objective)}`;
      } else if (type === 'adset') {
        title = entity.adset_name;
        sub = `Grupo de anuncios · ${entity.campaign_name}`;
      } else if (type === 'ad') {
        title = entity.ad_name;
        const created = entity.created_time ? new Date(entity.created_time).toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
        sub = `Anuncio · ${entity.adset_name} · publicado ${created}`;
      } else {
        title = entity.form_name;
        sub = `Formulario · ${entity.with_nq_rn} NQ&RN / ${entity.without_nq_rn} general`;
      }
      document.getElementById('entity-modal-title').textContent = title;
      document.getElementById('entity-modal-sub').textContent = sub;

      // Toggles
      const isForm = type === 'form';
      const isAd = type === 'ad';
      const resultLabel = isForm || isAd ? 'Leads' : resultLabelForEntity(entity);
      if (isForm) {
        document.getElementById('entity-modal-toggles').innerHTML = `
          <button class="entity-modal-toggle active" data-key="leads"><span class="dot"></span>Leads</button>
          <button class="entity-modal-toggle ${entityModalState.derived !== false ? 'active' : ''}" data-key="derived"><span class="dot"></span>Derivados</button>
        `;
      } else if (isAd) {
        document.getElementById('entity-modal-toggles').innerHTML = `
          <button class="entity-modal-toggle ${entityModalState.leads !== false ? 'active' : ''}" data-key="leads"><span class="dot"></span>Leads</button>
          <button class="entity-modal-toggle ${entityModalState.cpl !== false ? 'active' : ''}" data-key="cpl"><span class="dot"></span>CPL (USD)</button>
        `;
      } else {
        document.getElementById('entity-modal-toggles').innerHTML = `
          <button class="entity-modal-toggle ${entityModalState.spend ? 'active' : ''}" data-key="spend">
            <span class="dot"></span>Costo (USD)
          </button>
          <button class="entity-modal-toggle ${entityModalState.result ? 'active' : ''}" data-key="result">
            <span class="dot"></span>${resultLabel}
          </button>
        `;
      }
      document.querySelectorAll('#entity-modal-toggles .entity-modal-toggle').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          if (isForm || isAd) {
            entityModalState[key] = entityModalState[key] === false;
          } else {
            entityModalState[key] = !entityModalState[key];
          }
          btn.classList.toggle('active', entityModalState[key] !== false);
          if (isForm) renderFormChart(entity);
          else if (isAd) renderAdChart(entity);
          else renderEntityChart(entity);
        });
      });

      // Stats
      if (isForm) {
        document.getElementById('entity-modal-stats').innerHTML = `
          <div class="entity-stat"><div class="lbl">Leads totales</div><div class="val">${formatNum(entity.leads)}</div></div>
          <div class="entity-stat"><div class="lbl">Derivados</div><div class="val">${formatNum(entity.derived)}</div></div>
          <div class="entity-stat"><div class="lbl">NQ & RN</div><div class="val">${formatNum(entity.with_nq_rn)}</div></div>
          <div class="entity-stat"><div class="lbl">Generales</div><div class="val">${formatNum(entity.without_nq_rn)}</div></div>
        `;
      } else if (isAd) {
        document.getElementById('entity-modal-stats').innerHTML = `
          <div class="entity-stat"><div class="lbl">Leads</div><div class="val">${formatNum(entity.leads)}</div></div>
          <div class="entity-stat"><div class="lbl">CPL</div><div class="val">${entity.cost_per_lead != null ? formatUSD2(entity.cost_per_lead) : '—'}</div></div>
          <div class="entity-stat"><div class="lbl">Inversión</div><div class="val">${formatUSD2(entity.spend)}</div></div>
          <div class="entity-stat"><div class="lbl">CTR</div><div class="val">${formatPct(entity.ctr || 0)}</div></div>
        `;
      } else {
        const resultKey = resultKeyForEntity(entity);
        const resultTotal = entity[resultKey] != null ? entity[resultKey] : 0;
        const cost_per = resultTotal > 0 ? entity.spend / resultTotal : null;
        document.getElementById('entity-modal-stats').innerHTML = `
          <div class="entity-stat"><div class="lbl">Inversión</div><div class="val">${formatUSD2(entity.spend)}</div></div>
          <div class="entity-stat"><div class="lbl">${resultLabel}</div><div class="val">${formatNum(resultTotal)}</div></div>
          <div class="entity-stat"><div class="lbl">Costo / ${resultLabel.toLowerCase()}</div><div class="val">${cost_per != null ? formatUSD2(cost_per) : '—'}</div></div>
          <div class="entity-stat"><div class="lbl">CTR</div><div class="val">${formatPct(entity.ctr || 0)}</div></div>
        `;
      }

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (isForm) renderFormChart(entity);
      else if (isAd) renderAdChart(entity);
      else renderEntityChart(entity);
    }

    // Chart por anuncio: leads (eje izq) + CPL diario en USD (eje der)
    function renderAdChart(entity) {
      const ctx = document.getElementById('entity-modal-chart');
      if (!ctx) return;
      const dates = [];
      const start = new Date(lastReportData.desde + 'T12:00:00Z');
      const end = new Date(lastReportData.hasta + 'T12:00:00Z');
      for (let dt = new Date(start); dt <= end; dt.setUTCDate(dt.getUTCDate() + 1)) dates.push(isoDate(dt));
      const dailyMap = new Map((entity.daily || []).map((d) => [d.date, d]));
      const labels = dates.map((d) => new Date(d + 'T12:00:00Z').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }));
      const showLeads = entityModalState.leads !== false;
      const showCpl = entityModalState.cpl !== false;
      const datasets = [];
      if (showLeads) datasets.push({
        label: 'Leads',
        data: dates.map((d) => dailyMap.get(d)?.leads || 0),
        borderColor: '#057488', backgroundColor: 'rgba(5,116,136,0.10)',
        yAxisID: 'y', tension: 0.35, fill: true, pointRadius: 2.5, pointHoverRadius: 5, borderWidth: 2.5,
      });
      if (showCpl) datasets.push({
        label: 'CPL (USD)',
        data: dates.map((d) => {
          const row = dailyMap.get(d);
          if (!row || !row.leads) return null;
          return +(row.spend / row.leads).toFixed(2);
        }),
        borderColor: '#c0392b', borderDash: [5, 4], backgroundColor: 'transparent',
        yAxisID: 'y1', spanGaps: false,
        tension: 0.35, fill: false, pointRadius: 2, pointHoverRadius: 4, borderWidth: 2,
      });
      if (entityChart) entityChart.destroy();
      entityChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (c) => {
                  const isCpl = c.dataset.yAxisID === 'y1';
                  const v = c.parsed.y;
                  if (v == null) return null;
                  const f = isCpl ? '$' + Number(v).toFixed(2) : Number(v).toLocaleString('es-AR');
                  return `${c.dataset.label}: ${f}`;
                },
              },
              backgroundColor: '#1a3a6e', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 8,
            },
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#6e7b96', font: { size: 10 }, maxRotation: 0, autoSkipPadding: 16 } },
            y: {
              display: showLeads, beginAtZero: true, position: 'left',
              grid: { color: 'rgba(110,123,150,0.08)' },
              ticks: { color: '#6e7b96', font: { size: 10 }, callback: (v) => Number(v).toLocaleString('es-AR') },
              title: { display: true, text: 'Leads', color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
            y1: {
              display: showCpl, beginAtZero: true, position: 'right',
              grid: { drawOnChartArea: !showLeads, color: 'rgba(110,123,150,0.05)' },
              ticks: { color: '#6e7b96', font: { size: 10 }, callback: (v) => '$' + Number(v).toFixed(2) },
              title: { display: true, text: 'CPL USD', color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
          },
        },
      });
    }

    function renderFormChart(entity) {
      const ctx = document.getElementById('entity-modal-chart');
      if (!ctx) return;
      const dates = [];
      const start = new Date(lastReportData.desde + 'T12:00:00Z');
      const end = new Date(lastReportData.hasta + 'T12:00:00Z');
      for (let dt = new Date(start); dt <= end; dt.setUTCDate(dt.getUTCDate() + 1)) dates.push(isoDate(dt));
      const dailyMap = new Map((entity.daily || []).map((d) => [d.date, d]));
      const labels = dates.map((d) => new Date(d + 'T12:00:00Z').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }));

      const showLeads = entityModalState.leads !== false;
      const showDerived = entityModalState.derived !== false;

      const datasets = [];
      if (showLeads) datasets.push({
        label: 'Leads', data: dates.map((d) => dailyMap.get(d)?.leads || 0),
        borderColor: '#057488', backgroundColor: 'rgba(5, 116, 136, 0.10)',
        yAxisID: 'y', tension: 0.35, fill: true, pointRadius: 2.5, pointHoverRadius: 5, borderWidth: 2.5,
      });
      if (showDerived) datasets.push({
        label: 'Derivados', data: dates.map((d) => dailyMap.get(d)?.derived || 0),
        borderColor: '#4a90e2', backgroundColor: 'rgba(74, 144, 226, 0.08)',
        yAxisID: 'y', tension: 0.35, fill: false, pointRadius: 2, pointHoverRadius: 4, borderWidth: 2,
      });

      if (entityChart) entityChart.destroy();
      entityChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: { backgroundColor: '#1a3a6e', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 8 },
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#6e7b96', font: { size: 10 }, maxRotation: 0, autoSkipPadding: 16 } },
            y: { beginAtZero: true, grid: { color: 'rgba(110, 123, 150, 0.08)' }, ticks: { color: '#6e7b96', font: { size: 10 }, callback: (v) => Number(v).toLocaleString('es-AR') }, title: { display: true, text: 'Cantidad', color: '#93a1bd', font: { size: 10, weight: 500 } } },
          },
        },
      });
    }

    function closeEntityModal() {
      const modal = document.getElementById('entity-modal');
      modal.classList.remove('open');
      document.body.style.overflow = '';
      if (entityChart) { entityChart.destroy(); entityChart = null; }
    }

    function renderEntityChart(entity) {
      const ctx = document.getElementById('entity-modal-chart');
      if (!ctx) return;
      const resultKey = resultKeyForEntity(entity);
      const resultLabel = resultLabelForEntity(entity);

      // Eje X: días del período
      const dates = [];
      const start = new Date(lastReportData.desde + 'T12:00:00Z');
      const end = new Date(lastReportData.hasta + 'T12:00:00Z');
      for (let dt = new Date(start); dt <= end; dt.setUTCDate(dt.getUTCDate() + 1)) {
        dates.push(isoDate(dt));
      }
      const dailyMap = new Map((entity.daily || []).map((d) => [d.date, d]));
      const labels = dates.map((d) => new Date(d + 'T12:00:00Z').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }));

      const datasets = [];
      if (entityModalState.result) {
        datasets.push({
          label: resultLabel,
          data: dates.map((d) => dailyMap.get(d)?.[resultKey] || 0),
          borderColor: '#057488',
          backgroundColor: 'rgba(5, 116, 136, 0.10)',
          yAxisID: 'y',
          tension: 0.35, fill: true, pointRadius: 2.5, pointHoverRadius: 5, borderWidth: 2.5,
        });
      }
      if (entityModalState.spend) {
        datasets.push({
          label: 'Costo (USD)',
          data: dates.map((d) => +(dailyMap.get(d)?.spend || 0).toFixed(2)),
          borderColor: '#4a90e2',
          borderDash: [5, 4],
          backgroundColor: 'transparent',
          yAxisID: 'y1',
          tension: 0.35, fill: false, pointRadius: 2, pointHoverRadius: 4, borderWidth: 2,
        });
      }

      const showResult = entityModalState.result;
      const showSpend = entityModalState.spend;

      if (entityChart) entityChart.destroy();
      entityChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (c) => {
                  const isCost = c.dataset.yAxisID === 'y1';
                  const v = c.parsed.y;
                  const formatted = isCost
                    ? '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    : Number(v).toLocaleString('es-AR');
                  return `${c.dataset.label}: ${formatted}`;
                },
              },
              backgroundColor: '#1a3a6e', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 8,
            },
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#6e7b96', font: { size: 10 }, maxRotation: 0, autoSkipPadding: 16 } },
            y: {
              display: showResult, beginAtZero: true, position: 'left',
              grid: { color: 'rgba(110, 123, 150, 0.08)' },
              ticks: { color: '#6e7b96', font: { size: 10 }, callback: (v) => Number(v).toLocaleString('es-AR') },
              title: { display: true, text: resultLabel, color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
            y1: {
              display: showSpend, beginAtZero: true, position: 'right',
              grid: { drawOnChartArea: !showResult, color: 'rgba(110, 123, 150, 0.05)' },
              ticks: { color: '#6e7b96', font: { size: 10 }, callback: (v) => '$' + Number(v).toFixed(2) },
              title: { display: true, text: 'USD', color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
          },
        },
      });
    }

    document.getElementById('entity-modal-close').addEventListener('click', closeEntityModal);
    document.getElementById('entity-modal').addEventListener('click', (e) => {
      if (e.target.id === 'entity-modal') closeEntityModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('entity-modal').classList.contains('open')) closeEntityModal();
    });

    let lastReportData = null;
    let currentUserName = '';
    const seriesState = {
      forms_count: true,
      forms_cost: false,
      derived_count: true,
      derived_cost: false,
      hitos: false,
    };

    // Hitos hardcodeados (linea punteada vertical con bandera en el chart de evolucion)
    const HITOS = [
      { date: '2025-08-15', label: 'Inicio gestión', color: '#057488' },
      { date: '2026-05-07', label: 'Lanzamiento NQ & RN', color: '#c0392b' }
    ];

    // Plugin de Chart.js: dibuja lineas verticales punteadas para cada hito en seriesState.hitos
    const hitosChartPlugin = {
      id: 'hitos',
      afterDatasetsDraw(chart, args, opts) {
        if (!opts || !opts.enabled || !opts.hitos || !opts.hitos.length) return;
        const xScale = chart.scales && chart.scales.x;
        const chartArea = chart.chartArea;
        const ctx = chart.ctx;
        if (!xScale || !chartArea) return;
        opts.hitos.forEach((h) => {
          if (typeof h.dateIndex !== 'number' || h.dateIndex < 0) return;
          const xPos = xScale.getPixelForValue(h.dateIndex);
          if (xPos < chartArea.left || xPos > chartArea.right) return;
          // Linea punteada
          ctx.save();
          ctx.strokeStyle = h.color || '#c0392b';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([5, 4]);
          ctx.beginPath();
          ctx.moveTo(xPos, chartArea.top);
          ctx.lineTo(xPos, chartArea.bottom);
          ctx.stroke();
          // Bandera arriba con texto
          ctx.setLineDash([]);
          ctx.font = '600 10px Inter, sans-serif';
          const text = h.label;
          const padX = 6, padY = 3;
          const w = ctx.measureText(text).width + padX * 2;
          const fx = xPos + 2;
          const fy = chartArea.top + 2;
          ctx.fillStyle = h.color || '#c0392b';
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(fx, fy, w, 16 + padY, 3) : ctx.rect(fx, fy, w, 16 + padY);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, fx + padX, fy + 9 + padY / 2);
          ctx.restore();
        });
      },
    };
    if (typeof Chart !== 'undefined') Chart.register(hitosChartPlugin);

    function firstNameFromEmail(email) {
      const map = {
        'dev.federicocuellos@gmail.com': 'Federico',
        'tomasbadia.j@gmail.com': 'Tomás',
      };
      if (map[email]) return map[email];
      const local = (email || '').split('@')[0];
      const first = local.split(/[._]/)[0] || '';
      return first.charAt(0).toUpperCase() + first.slice(1);
    }

    function greetingForNow() {
      const h = new Date().getHours();
      if (h < 12) return 'Buen día';
      if (h < 19) return 'Buenas tardes';
      return 'Buenas noches';
    }

    let evolutionChart = null;
    function renderEvolutionChart(data, state) {
      const ctx = document.getElementById('evolution-chart');
      if (!ctx) return;

      // Date axis
      const dates = [];
      const start = new Date(data.desde + 'T12:00:00Z');
      const end = new Date(data.hasta + 'T12:00:00Z');
      for (let dt = new Date(start); dt <= end; dt.setUTCDate(dt.getUTCDate() + 1)) {
        dates.push(isoDate(dt));
      }

      const metaDaily = new Map((data.meta.daily || []).map((r) => [r.date, r]));
      const kommoDaily = new Map((data.kommo.daily || []).map((r) => [r.date, r]));
      const labels = dates.map((d) => new Date(d + 'T12:00:00Z').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }));

      const datasets = [];

      if (state.forms_count) {
        datasets.push({
          label: 'Formularios Meta',
          data: dates.map((d) => metaDaily.get(d)?.leads || 0),
          borderColor: '#057488',
          backgroundColor: 'rgba(5, 116, 136, 0.10)',
          yAxisID: 'y',
          tension: 0.35, fill: true, pointRadius: 2.5, pointHoverRadius: 5, borderWidth: 2.5,
        });
      }
      if (state.forms_cost) {
        datasets.push({
          label: 'Costo / formulario',
          data: dates.map((d) => {
            const m = metaDaily.get(d);
            return m && m.leads > 0 ? +(m.spend / m.leads).toFixed(2) : 0;
          }),
          borderColor: '#057488',
          borderDash: [5, 4],
          backgroundColor: 'transparent',
          yAxisID: 'y1',
          tension: 0.35, fill: false, pointRadius: 2, pointHoverRadius: 4, borderWidth: 2,
        });
      }
      if (state.derived_count) {
        datasets.push({
          label: 'Leads derivados',
          data: dates.map((d) => kommoDaily.get(d)?.derived || 0),
          borderColor: '#4a90e2',
          backgroundColor: 'rgba(74, 144, 226, 0.10)',
          yAxisID: 'y',
          tension: 0.35, fill: true, pointRadius: 2.5, pointHoverRadius: 5, borderWidth: 2.5,
        });
      }
      if (state.derived_cost) {
        datasets.push({
          label: 'Costo / derivado',
          data: dates.map((d) => {
            const m = metaDaily.get(d);
            const k = kommoDaily.get(d);
            const spend = m ? m.spend : 0;
            return k && k.derived > 0 ? +(spend / k.derived).toFixed(2) : 0;
          }),
          borderColor: '#4a90e2',
          borderDash: [5, 4],
          backgroundColor: 'transparent',
          yAxisID: 'y1',
          tension: 0.35, fill: false, pointRadius: 2, pointHoverRadius: 4, borderWidth: 2,
        });
      }

      const showCount = state.forms_count || state.derived_count;
      const showCost  = state.forms_cost || state.derived_cost;

      // Hitos: ubicamos cada uno por indice dentro del array de dates ISO
      const hitosForChart = (state.hitos ? HITOS : []).map((h) => ({
        ...h,
        dateIndex: dates.indexOf(h.date),
      })).filter((h) => h.dateIndex >= 0);

      const cfg = {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            hitos: { enabled: hitosForChart.length > 0, hitos: hitosForChart },
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const isCostSeries = ctx.dataset.yAxisID === 'y1';
                  const v = ctx.parsed.y;
                  const formatted = isCostSeries
                    ? '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    : Number(v).toLocaleString('es-AR');
                  return `${ctx.dataset.label}: ${formatted}`;
                },
              },
              backgroundColor: '#1a3a6e', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 8,
            },
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#6e7b96', font: { size: 10 }, maxRotation: 0, autoSkipPadding: 16 } },
            y: {
              display: showCount,
              beginAtZero: true, position: 'left',
              grid: { color: 'rgba(110, 123, 150, 0.08)' },
              ticks: {
                color: '#6e7b96', font: { size: 10 },
                callback: (v) => Number(v).toLocaleString('es-AR'),
              },
              title: { display: true, text: 'Cantidad', color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
            y1: {
              display: showCost,
              beginAtZero: true, position: 'right',
              grid: { drawOnChartArea: !showCount, color: 'rgba(110, 123, 150, 0.05)' },
              ticks: {
                color: '#6e7b96', font: { size: 10 },
                callback: (v) => '$' + Number(v).toFixed(2),
              },
              title: { display: true, text: 'USD', color: '#93a1bd', font: { size: 10, weight: 500 } },
            },
          },
        },
      };

      if (evolutionChart) evolutionChart.destroy();
      evolutionChart = new Chart(ctx, cfg);
    }

    (async () => {
      const token = sessionStorage.getItem(TOKEN_KEY);
      if (!token) {
        location.replace('dashboard/login.html');
        return;
      }
      try {
        const data = await verifyToken(token);
        currentUserName = firstNameFromEmail(data.email);
        const ue = document.getElementById('user-email');
        if (ue) ue.textContent = data.email;
        const ua = document.getElementById('user-avatar');
        if (ua) ua.textContent = (currentUserName[0] || data.email[0] || 'U').toUpperCase();
        document.getElementById('auth-loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        fetchReport();
      } catch (e) {
        sessionStorage.removeItem(TOKEN_KEY);
        location.replace('dashboard/login.html');
      }
    })();
  </script>
