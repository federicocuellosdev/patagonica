<style>
@font-face{font-family:"Cormorant";src:url(fonts/cormorant-garamond-latin-wght-normal.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Cormorant";src:url(fonts/cormorant-garamond-latin-wght-italic.woff2) format("woff2");font-weight:300 700;font-style:italic;font-display:swap}
@font-face{font-family:"Montserrat";src:url(fonts/montserrat-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}

:root{
  --noche:#02181b;      /* el lago de noche */
  --petroleo:#002E33;
  --lago:#177588;
  --hielo:#9fc3dc;
  --bruma:#e9efee;
  --papel:#f5f8f7;
  --tinta:#10272b;
  --tinta-2:#526a6e;
  --linea:rgba(0,46,51,.16);
  --linea-clara:rgba(233,239,238,.18);
  --serif:"Cormorant","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ancho:1240px;
  --borde:clamp(20px,5vw,64px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 1rem/1.7 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,figure,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--hielo);outline-offset:3px}
.claro :focus-visible{outline-color:var(--lago)}
[hidden]{display:none!important}

.wrap{max-width:var(--ancho);margin-inline:auto;padding-inline:var(--borde)}
.rotulo{font:italic 400 1.2rem/1.2 var(--serif);color:var(--lago);margin-bottom:.9rem}
.oscuro .rotulo{color:var(--hielo)}
h2{font:300 clamp(2.3rem,5vw,4.3rem)/1.04 var(--serif);letter-spacing:-.012em;text-wrap:balance;font-variant-numeric:lining-nums}
h3{font:400 1.55rem/1.15 var(--serif);font-variant-numeric:lining-nums}
.bajada{font-size:1.06rem;line-height:1.75;color:var(--tinta-2);max-width:62ch;text-wrap:pretty}
.oscuro{background:var(--petroleo);color:var(--bruma)}
.oscuro .bajada{color:rgba(233,239,238,.78)}
section{position:relative}
section[id]:not(#inicio){scroll-margin-top:70px}
.bloque{padding-block:clamp(84px,12vw,170px)}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:50px;padding:0 1.7em;border:1px solid transparent;border-radius:2px;font:500 .9rem/1 var(--sans);letter-spacing:.02em;text-decoration:none;transition:background .25s,color .25s,border-color .25s}
.btn-lleno{background:var(--bruma);color:var(--petroleo)}
.btn-lleno:hover{background:#fff}
.btn-linea{border-color:rgba(233,239,238,.55);color:var(--bruma)}
.btn-linea:hover{background:rgba(233,239,238,.12);border-color:var(--bruma)}
.btn-tinta{background:var(--petroleo);color:var(--bruma)}
.btn-tinta:hover{background:var(--lago)}
.btn-lago{background:var(--lago);color:#fff}
.btn-lago:hover{background:#1b8499}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- Navegación ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:60;color:var(--bruma);transition:background .4s,transform .4s,backdrop-filter .4s;padding-top:env(safe-area-inset-top,0)}
.nav .in{display:flex;align-items:center;gap:28px;height:72px;max-width:1500px;margin:auto;padding-inline:var(--borde)}
.nav .marca{display:block;height:44px;transition:opacity .4s}
.nav .marca img{height:100%;width:auto}
.nav ul{display:flex;gap:30px;margin-left:auto}
.nav ul a{font:500 .86rem/1 var(--sans);text-decoration:none;opacity:.82;padding:10px 0;border-bottom:1px solid transparent;transition:opacity .2s,border-color .2s}
.nav ul a:hover,.nav ul a.activo{opacity:1;border-color:currentColor}
.nav .btn{min-height:40px;padding:0 1.25em;font-size:.84rem}
.nav.solida{background:rgba(2,24,27,.86);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.nav.sin-marca .marca{opacity:0;pointer-events:none}
.menu-btn{display:none;min-height:40px;padding:0 4px;border:0;background:none;color:var(--bruma);font:500 .84rem/1 var(--sans)}
@media(max-width:860px){
  .nav .in{height:62px;gap:16px}.nav .marca{height:36px}
  .menu-btn{display:block;margin-left:auto}
  .nav ul{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;margin:0;padding:6px var(--borde) 18px;background:#02181b;border-top:1px solid var(--linea-clara);box-shadow:0 30px 40px -20px rgba(0,0,0,.6)}
  .nav.abierta{background:#02181b}
  .nav.abierta ul{display:flex}
  .nav ul a{display:block;padding:16px 0;font-size:1rem;opacity:1;border-bottom:1px solid var(--linea-clara)}
  .nav ul li:last-child a{border-bottom:0}
}

/* ---------- Portada ---------- */
.hero{min-height:100vh;min-height:100svh;display:grid;align-items:end;color:var(--bruma);background:var(--noche);overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;animation:llega 2.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes llega{from{transform:scale(1.07)}to{transform:none}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,24,27,.55) 0,rgba(2,24,27,.05) 30%,rgba(2,24,27,.22) 55%,rgba(2,24,27,.9) 100%)}
.hero .wrap{position:relative;z-index:1;width:100%;padding-top:110px;padding-bottom:calc(clamp(40px,8vh,84px) + env(safe-area-inset-bottom,0px))}
.hero .logo{width:min(62vw,340px);height:auto;margin-bottom:clamp(20px,4vh,34px);filter:drop-shadow(0 3px 22px rgba(0,0,0,.45))}
.hero .rotulo{color:var(--bruma);opacity:.92;font-size:clamp(1.2rem,1.8vw,1.5rem)}
.hero h1{font:300 clamp(2.2rem,5.6vw,4.9rem)/1.02 var(--serif);letter-spacing:-.015em;max-width:17ch;text-wrap:balance;font-variant-numeric:lining-nums;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.acciones{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(24px,4vh,40px)}

/* ---------- El proyecto ---------- */
.proy-cab{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(28px,6vw,96px);align-items:end}
.cifras{display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(56px,8vw,110px);border-top:1px solid var(--linea)}
.cifras div{padding:26px 22px 0 0}
.cifras div+div{padding-left:22px;border-left:1px solid var(--linea)}
.cifras strong{display:block;font:300 clamp(2.1rem,4.4vw,3.7rem)/1 var(--serif);font-variant-numeric:lining-nums;color:var(--petroleo);white-space:nowrap}
.cifras span{display:block;margin-top:10px;font-size:.9rem;color:var(--tinta-2)}
.atributos{display:grid;gap:clamp(64px,10vw,140px);margin-top:clamp(80px,11vw,160px)}
.atr{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(28px,6vw,90px);align-items:end}
.atr:nth-child(even){grid-template-columns:minmax(0,4fr) minmax(0,7fr)}
.atr:nth-child(even) figure{order:2}
.atr figure{overflow:hidden;background:var(--bruma)}
.atr img{width:100%;aspect-ratio:4/3;object-fit:cover}
.atr:nth-child(2) img{aspect-ratio:16/11}
.atr .t{padding-bottom:clamp(0px,3vw,40px)}
.atr h3{font-size:clamp(1.7rem,3vw,2.5rem);font-weight:300;margin-bottom:16px;text-wrap:balance}
.atr p{color:var(--tinta-2);max-width:40ch}

/* ---------- Espacio verde ---------- */
.verde{min-height:min(100vh,980px);display:grid;align-items:end;color:var(--bruma);overflow:hidden;background:var(--noche)}
.verde>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.verde::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,24,27,.9) 0,rgba(2,24,27,.62) 42%,rgba(2,24,27,.1) 78%),linear-gradient(0deg,rgba(2,24,27,.6),transparent 45%)}
.verde .wrap{position:relative;z-index:1;width:100%;padding-block:clamp(84px,12vw,150px)}
.verde h2{max-width:13ch}
.verde .bajada{margin-top:26px;max-width:52ch;color:rgba(233,239,238,.86)}
.verde dl{display:flex;gap:clamp(30px,6vw,80px);margin-top:44px;padding-top:26px;border-top:1px solid var(--linea-clara);max-width:560px}
.verde dt{font:300 clamp(2rem,4vw,3.1rem)/1 var(--serif);font-variant-numeric:lining-nums}
.verde dd{margin-top:8px;font-size:.88rem;color:rgba(233,239,238,.76)}

/* ---------- Masterplan ---------- */
#masterplan{background:linear-gradient(180deg,var(--noche),#04161a 20%,#04161a 80%,var(--noche));--mz-a:#7fb0a4;--mz-b:#b4d1a6;--c-vista:#8dbdd6;--c-conf:#d9c89c;--crema:#f3ead2;--arena:#e4d9bf;--mp-tinta:#0a1719;--mp-linea:rgba(233,239,238,.12);--mp-mudo:rgba(233,239,238,.58)}
.mp-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:26px 40px;flex-wrap:wrap;margin-bottom:30px}
.mp-filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:42px;padding:0 20px;border:1px solid var(--mp-linea);border-radius:999px;background:rgba(233,239,238,.03);font:500 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mp-mudo);transition:background .25s,color .25s,border-color .25s}
.chip:hover{color:#fff;border-color:rgba(233,239,238,.4)}
.chip[aria-pressed=true]{background:var(--bruma);border-color:var(--bruma);color:var(--mp-tinta)}
.conm{display:inline-flex;align-items:center;gap:12px;margin-left:10px;font:400 .82rem/1 var(--sans);color:var(--mp-mudo);background:none;border:0;padding:8px 0}
.conm i{position:relative;width:40px;height:22px;border-radius:999px;background:rgba(233,239,238,.14);transition:background .25s}
.conm i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s}
.conm[aria-pressed=true]{color:#fff}
.conm[aria-pressed=true] i{background:var(--mz-a)}
.conm[aria-pressed=true] i::after{transform:translateX(18px)}
.mp-cuerpo{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:22px;align-items:stretch}
.plano-marco{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--mp-linea);background:radial-gradient(70% 60% at 50% 45%,#11292e 0,#07171b 70%)}
.plano{position:relative;width:100%;aspect-ratio:1365/1640;max-height:90vh;margin:auto;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.plano.zoom{touch-action:none;cursor:grab}
.plano.arrastra{cursor:grabbing}
.lienzo{position:absolute;inset:62px 18px 106px;transform-origin:0 0;will-change:transform}
.lienzo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#plano-svg *{outline:none}
.sit-luz{fill:#000;opacity:.5;filter:url(#difuso)}
.sit-base{fill:#0d2327}
.verde{fill:#10302a;stroke:rgba(150,200,170,.22);stroke-width:1.2;vector-effect:non-scaling-stroke}
.calles{opacity:.15}
.calles path{fill:#e9e2d0}
.eje{fill:none;stroke:rgba(241,239,232,.34);stroke-width:1;stroke-dasharray:5 6;vector-effect:non-scaling-stroke}
.ctx{font:500 15px var(--sans);letter-spacing:.3em;fill:rgba(233,239,238,.52);text-anchor:middle;pointer-events:none}
.lote{cursor:pointer;stroke-linejoin:round;stroke:rgba(6,18,21,.95);stroke-width:1.4;vector-effect:non-scaling-stroke;fill:var(--c);fill-opacity:.92;transition:fill .45s cubic-bezier(.2,.7,.2,1),fill-opacity .45s,opacity .45s,stroke .3s}
.lote.vendido{fill:#1c3236;fill-opacity:1}
#plano-svg.hov .lote:not(.vendido):not(.on):not(.sel){fill-opacity:.42}
#plano-svg.hov .lote.vendido:not(.on){opacity:.7}
.lote.on{fill:var(--crema);fill-opacity:1;stroke:#fff;stroke-width:1.8}
.lote.vendido.on{fill:#24393d}
.lote.sel{fill:var(--arena)!important;fill-opacity:1!important;stroke:#fff;stroke-width:2}
.lote.vendido.sel{fill:#2c4347!important}
.lote.fuera{opacity:.12!important;pointer-events:none}
.anillo{fill:none;stroke:var(--arena);stroke-width:1.6;stroke-dasharray:6 5;pointer-events:none;vector-effect:non-scaling-stroke;animation:anillo 1.6s linear infinite;opacity:.9}
@keyframes anillo{to{stroke-dashoffset:-22}}
.rt{pointer-events:none;transition:opacity .45s}
.rt text{text-anchor:middle;font-family:var(--sans)}
.rt .n{font-size:38px;font-weight:400;letter-spacing:.01em;fill:var(--mp-tinta)}
.rt .a{font-size:15.5px;font-weight:500;letter-spacing:.05em;fill:rgba(10,23,25,.82)}
.rt.v .n{font-size:32px;fill:rgba(233,239,238,.58)}
.rt.v .a{fill:rgba(233,239,238,.52);letter-spacing:.2em;font-size:14px}
.rt.c .a{letter-spacing:.14em;font-size:13.5px}
.rt.fuera{opacity:.12}
.rt.r .n{font-size:18px;font-weight:600;letter-spacing:.3em;fill:rgba(225,242,230,.96);paint-order:stroke;stroke:rgba(9,34,28,.92);stroke-width:9px;stroke-linejoin:round}
.capa-men{display:none}
.plano.mensura .capa-com,.plano.mensura .rt,.plano.mensura .anillo{display:none}
.plano.mensura .capa-men{display:block}
.plano.mensura .lote{fill:rgba(23,117,136,0)!important;stroke:transparent}
.plano.mensura .lote.on,.plano.mensura .lote.sel{fill:rgba(23,117,136,.4)!important;stroke:var(--petroleo);stroke-width:2.5}
.plano.mensura .lote.fuera{fill:rgba(255,255,255,.85)!important;opacity:1!important}
.plano.mensura #plano-svg.hov .lote{opacity:1}
.mp-insignia{position:absolute;left:18px;top:16px;z-index:2;display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:999px;border:1px solid var(--mp-linea);background:rgba(6,18,21,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:.74rem;color:var(--mp-mudo)}
.mp-insignia b{font:400 1rem/1 var(--sans);color:#fff;font-variant-numeric:tabular-nums}
.mp-insignia i{width:7px;height:7px;border-radius:50%;background:var(--mz-a);animation:pulso 2.4s ease infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(127,176,164,.6)}70%{box-shadow:0 0 0 9px rgba(127,176,164,0)}100%{box-shadow:0 0 0 0 rgba(127,176,164,0)}}
.mp-aclara{position:absolute;right:74px;top:18px;z-index:2;max-width:260px;text-align:right;font-size:.68rem;line-height:1.5;color:rgba(233,239,238,.66);pointer-events:none}
.plano-ctrl{position:absolute;right:16px;top:14px;z-index:2;display:grid;border:1px solid var(--mp-linea);border-radius:14px;overflow:hidden;background:rgba(6,18,21,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.plano-ctrl button{width:40px;height:40px;border:0;background:none;color:rgba(233,239,238,.85);font:300 1.2rem/1 var(--sans);display:grid;place-items:center;transition:background .2s}
.plano-ctrl button+button{border-top:1px solid var(--mp-linea)}
.plano-ctrl button:hover{background:rgba(233,239,238,.1)}
.plano-ctrl button:disabled{opacity:.35;cursor:default;background:none}
.plano-ctrl svg{width:15px;height:15px}
.leyenda{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;display:flex;gap:9px 18px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-radius:22px;border:1px solid var(--mp-linea);background:rgba(6,18,21,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:.72rem;letter-spacing:.03em;color:var(--mp-mudo)}
.leyenda span{display:flex;align-items:center;gap:8px}
.leyenda i{width:10px;height:10px;border-radius:50%;display:inline-block}
.leyenda button{margin-left:auto;background:none;border:0;padding:2px 0;font:500 .72rem/1 var(--sans);color:rgba(233,239,238,.85);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(233,239,238,.35)}
.leyenda button:hover{color:#fff}
.tip{position:fixed;left:0;top:0;z-index:65;pointer-events:none;padding:12px 16px;border-radius:14px;background:rgba(8,22,25,.8);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:.78rem;color:#fff;white-space:nowrap;opacity:0;transition:opacity .25s;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.tip.on{opacity:1}
.tip small{display:block;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mz-b);margin-bottom:4px}
.tip b{display:block;font:400 1rem/1.2 var(--sans)}
.tip span{color:var(--mp-mudo);font-variant-numeric:tabular-nums}
.mp-nota{margin-top:14px;font-size:.78rem;line-height:1.6;color:rgba(233,239,238,.64);max-width:76ch}

.panel{position:relative;border-radius:26px;border:1px solid var(--mp-linea);background:linear-gradient(180deg,rgba(233,239,238,.045),rgba(233,239,238,.015));color:var(--bruma);display:flex;flex-direction:column;max-height:calc(90vh + 2px);overflow:hidden}
.p-in{display:flex;flex-direction:column;flex:1;min-height:0;padding:clamp(24px,2.6vw,38px)}
.mayus{font:500 .68rem/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--mp-mudo)}
.panel h3{font:300 clamp(1.7rem,2.3vw,2.2rem)/1.12 var(--sans);letter-spacing:-.01em;margin:20px 0 14px;color:#fff;text-wrap:balance}
.panel .txt{font-size:.92rem;line-height:1.65;color:var(--mp-mudo);max-width:34ch}
.cuentas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.cuentas div{padding:16px 14px 18px;border:1px solid var(--mp-linea);border-radius:16px}
.cuentas b{display:block;font:300 1.75rem/1.05 var(--sans);color:#fff;font-variant-numeric:tabular-nums}
.cuentas span{display:block;margin-top:9px;font-size:.7rem;line-height:1.4;color:var(--mp-mudo)}
.lista-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 6px}
.lista-cab select{font:500 .74rem/1 var(--sans);color:#fff;background:#0c2529;border:1px solid var(--mp-linea);border-radius:999px;padding:8px 12px}
.lista{overflow:auto;overscroll-behavior:contain;flex:1;min-height:150px;margin-inline:-10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.fila{display:grid;grid-template-columns:10px 46px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 10px;border:0;border-bottom:1px solid var(--mp-linea);border-radius:0;background:none;text-align:left;color:inherit;transition:background .2s}
.fila:hover,.fila:focus-visible{background:rgba(233,239,238,.06)}
.fila .pt{width:9px;height:9px;border-radius:50%}
.fila .id{font:400 1.05rem/1 var(--sans);color:#fff}
.fila .d{font-size:.78rem;line-height:1.4;color:var(--mp-mudo);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.fila .p{font:500 .84rem/1.2 var(--sans);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:#fff}
.fila.vendido .id,.fila.vendido .p{color:rgba(233,239,238,.58)}

.est.disponible{background:rgba(127,176,164,.18);color:#a9d3c8}

/* ---------- Lo resuelto ---------- */
.resuelto .cab{display:grid;grid-template-columns:1fr;margin-bottom:clamp(40px,6vw,76px)}

.res-lista li{padding:30px 30px 38px 0;border-bottom:1px solid var(--linea)}
.res-lista li:not(:nth-child(3n+1)){padding-left:30px;border-left:1px solid var(--linea)}
.res-lista h3{font-size:1.6rem;font-weight:400;color:var(--petroleo);margin-bottom:10px;text-wrap:balance}
.res-lista p{font-size:.94rem;color:var(--tinta-2);max-width:34ch}
.marca-s{display:inline-block;vertical-align:middle;margin-left:6px;padding:5px 10px;border-radius:999px;background:rgba(23,117,136,.12);color:#11606f;font:600 .66rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}

/* ---------- Galería ---------- */

.gal-nav svg{width:18px;height:18px}
.tira{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:max(var(--borde),calc((100vw - var(--ancho))/2 + var(--borde)));scroll-padding-inline:max(var(--borde),calc((100vw - var(--ancho))/2 + var(--borde)))}
.tira::-webkit-scrollbar{display:none}
.tira figure{flex:none;scroll-snap-align:start;height:min(66vh,620px);position:relative}

.visor svg{width:18px;height:18px}
.visor .x{top:16px;right:16px}.visor .ant{left:16px;top:50%;margin-top:-24px}.visor .sig{right:16px;top:50%;margin-top:-24px}

/* ---------- Ubicación ---------- */
.ubi{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(30px,6vw,96px);align-items:end}

.mapa{grid-column:1/-1;background:#10232e;border-radius:3px;overflow:hidden}

.mapa-svg .agua path{fill:#0b1d27}

.mapa-svg .r-min path{fill:none;stroke:rgba(220,235,245,.2);stroke-width:1.1;stroke-linecap:round}
.mapa-svg .r-may path{fill:none;stroke:rgba(230,240,248,.42);stroke-width:2.2;stroke-linecap:round}
.mapa-svg .r-40 path{fill:none;stroke:rgba(240,246,250,.9);stroke-width:3.8;stroke-linecap:round}
.mapa-svg .halo{paint-order:stroke;stroke:rgba(16,32,42,.88);stroke-width:4px;stroke-linejoin:round}
.mapa-svg .m-lago{font:italic 300 46px var(--serif);letter-spacing:.3em;fill:rgba(159,195,220,.36)}
.mapa-svg .m-zona{display:none;font-size:17px;letter-spacing:.3em;fill:var(--hielo);font-weight:600}
.mapa-svg .mk-c{fill:#10232e;stroke:var(--hielo);stroke-width:1.6;transition:fill .25s,stroke-width .25s}
.mapa-svg .mk.on .mk-c,.mapa-svg .mk:hover .mk-c{fill:var(--lago);stroke:#fff;stroke-width:2.4}
.mapa-svg .mk-i path,.mapa-svg .mk-i circle{fill:none;stroke:#fff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.mapa-svg .mk-t{fill:#fff;font-size:21px;font-weight:600;letter-spacing:.1em}
.mapa-svg .mk-s{fill:rgba(255,255,255,.82);font-size:18px;transform:translateY(7px)}
.mapa-svg .proy-p{fill:#fff}
.mapa-svg .proy-a{fill:none;stroke:#fff;stroke-width:2}
.mapa-svg .proy-l{fill:none;stroke:var(--hielo);stroke-width:1.2}
.mapa-svg .proy-card rect{fill:rgba(0,46,51,.94);stroke:var(--hielo);stroke-opacity:.7;rx:3px}
.mapa-svg .pc-t{fill:#fff;font:500 31px var(--serif);letter-spacing:.06em}
.mapa-svg .pc-s{fill:rgba(255,255,255,.78);font-size:13.5px;letter-spacing:.05em}
.mapa-svg .flecha path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.mapa-svg .m-attr{fill:rgba(255,255,255,.5);font-size:13px}

/* ---------- Cierre ---------- */
.cierre{min-height:min(92vh,880px);display:grid;align-items:center;color:var(--bruma);background:var(--noche);overflow:hidden}
.cierre>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cierre::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,24,27,.42),rgba(2,24,27,.74))}
.cierre .wrap{position:relative;z-index:1;width:100%;padding-block:110px;display:grid;justify-items:start}
.cierre h2{font-size:clamp(2.8rem,7vw,6rem)}
.cierre .bajada{margin-top:24px;color:rgba(233,239,238,.9);max-width:48ch}
.hace{background:var(--bruma);padding:clamp(56px,7vw,92px) 0;text-align:center}
.hace .wrap{display:grid;justify-items:center;gap:22px}
.hace p{font:italic 400 1.35rem/1 var(--serif);color:var(--lago)}
.hace img{height:clamp(34px,4.6vw,50px);width:auto}

footer{background:var(--noche);color:rgba(233,239,238,.8);padding:70px 0 calc(40px + env(safe-area-inset-bottom,0px));font-size:.9rem}

footer a:hover{border-color:var(--bruma);color:#fff}
footer .c{line-height:1.9}
footer .c b{font-weight:500;color:#fff}
footer .legal{margin-top:54px;padding-top:22px;border-top:1px solid var(--linea-clara);font-size:.78rem;line-height:1.7;color:rgba(233,239,238,.66);max-width:none}

.flot{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 16px;border-radius:999px;background:var(--lago);color:#fff;font:500 .86rem/1 var(--sans);text-decoration:none;box-shadow:0 14px 34px -12px rgba(0,0,0,.6);transition:transform .4s,opacity .4s,background .2s}
.flot:hover{background:#1b8499}
.flot svg{width:21px;height:21px}
.flot.oculto{opacity:0;transform:translateY(20px);pointer-events:none}
.borrador{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;padding:8px 14px;border-radius:999px;background:#fff;color:var(--petroleo);font:600 .72rem/1 var(--sans);letter-spacing:.04em;box-shadow:0 8px 24px -10px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
.aviso{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:80;padding:12px 18px;border-radius:3px;background:var(--bruma);color:var(--petroleo);font-size:.84rem;opacity:0;transition:.3s;pointer-events:none}
.aviso.on{opacity:1;transform:translateX(-50%)}
noscript p{padding:40px;text-align:center}

/* ---------- Adaptación ---------- */
@media(max-width:1060px){
  .mp-cuerpo{grid-template-columns:1fr}
  .panel{max-height:none}
  .lista{max-height:420px}
  .ficha{overflow:visible}
  .ubi{grid-template-columns:1fr}
  footer .g{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .proy-cab{grid-template-columns:1fr}
  .cifras{grid-template-columns:1fr 1fr}

  .cifras div:nth-child(n+3){border-top:1px solid var(--linea)}
  .atr,.atr:nth-child(even){grid-template-columns:1fr;gap:22px}
  .atr:nth-child(even) figure{order:0}
  .verde::after{background:linear-gradient(0deg,rgba(2,24,27,.94) 0,rgba(2,24,27,.72) 55%,rgba(2,24,27,.25) 100%)}
  .res-lista{grid-template-columns:1fr}
  .res-lista li,.res-lista li:not(:nth-child(3n+1)){padding:24px 0 28px;border-left:0}
  .plano{max-height:none;aspect-ratio:auto}
  .lienzo{position:relative;inset:auto;margin:70px 12px 14px;aspect-ratio:1365/1600}
  .plano-ctrl{grid-auto-flow:column;top:12px;right:12px}
  .plano-ctrl button+button{border-top:0;border-left:1px solid var(--mp-linea)}
  .mp-insignia{left:12px;top:12px;padding:10px 13px}
  .mp-aclara{display:none}
  .leyenda{position:relative;left:auto;right:auto;bottom:auto;margin:0 10px 12px;border-radius:18px}
  .leyenda button{margin-left:0;flex-basis:100%;text-align:left;padding-top:4px}
  .rt .n{font-size:46px}.rt .a{font-size:19px}.rt.v .n{font-size:38px}.rt.v .a,.rt.c .a{font-size:15px;letter-spacing:.1em}
  .rt.r .n{font-size:21px}

  .chip{padding:0 15px;min-height:40px}
  .gal-nav{display:none}
  .tira figure{height:auto}
  .tira button{height:auto}

  .tira figcaption{height:auto;white-space:normal;padding-top:10px;width:82vw}
  footer .g{grid-template-columns:1fr;gap:30px}
  .flot span{display:none}.flot{padding:0;width:54px;justify-content:center}
  .visor .ant,.visor .sig{top:auto;bottom:18px;margin:0}
  .visor .v-in{padding-bottom:84px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<body>
<noscript><p>Loma Guacha · Para ver esta página necesitás activar JavaScript en tu navegador.</p></noscript>
<div id="app"></div>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="datos.js"></script>
<script src="mapa.js"></script>
<script src="plano.js"></script>
<script>
(()=>{
'use strict';
const P = window.PROYECTO;
if(!P){ document.getElementById('app').innerHTML='<p style="padding:40px">No se pudo cargar datos.js.</p>'; return; }

/* ============ utilidades ============ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tx = s=>esc(String(s??'').replace(/\*/g,''));
const nf = new Intl.NumberFormat('es-AR');
const m2 = n=>nf.format(n)+' m²';
const usd = n=>'USD '+nf.format(n);
const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const suave = t=>t*t*(3-2*t);
const wsp = (msg,num)=>`https://wa.me/${num||P.agente.whatsapp}?text=${encodeURIComponent(msg)}`;
const ESTADOS = {disponible:'Disponible',reservado:'Reservado',vendido:'Vendido','a-confirmar':'A confirmar'};
const MOV_REDUCIDO = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICO = {
  wsp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.500 20.500l1.300-4.300A8.500 8.500 0 1112 20.500a8.400 8.400 0 01-4.100-1z"/><path d="M9 8.800c0 3.200 2.600 6 6 6.200l1.200-1.500-1.900-1-.8.800c-1-.5-1.800-1.300-2.300-2.300l.8-.800-1-1.900z"/></svg>',
  izq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  der:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  encuadre:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'
};
const MSG = {
  base:`Hola, quiero información sobre ${P.nombre}.`,
  disp:`Hola, quiero consultar la disponibilidad de ${P.nombre}.`,
  precios:`Hola, quiero recibir precios y formas de pago de ${P.nombre}.`,
  visita:`Hola, quiero coordinar una visita a ${P.nombre}.`
};
function avisar(t){ const a=$('#aviso'); a.textContent=t; a.classList.add('on'); clearTimeout(avisar.t); avisar.t=setTimeout(()=>a.classList.remove('on'),2200); }

/* ============ datos derivados ============ */
const E = P.explorador, NIVEL = E.niveles[0], LOTES = NIVEL.unidades;
const disponibles = LOTES.filter(u=>u.estado==='disponible');
const vendidos = LOTES.filter(u=>u.estado==='vendido');
const aConfirmar = LOTES.filter(u=>u.estado==='a-confirmar'||u.estado==='reservado');
const precios = LOTES.filter(u=>u.precio&&u.estado!=='vendido').map(u=>+u.precio);
const tieneVista = u=>!!(u.datos&&u.datos.Vista);
const D = P.pin || {lat:P.ubicacion.lat,lng:P.ubicacion.lng};

/* ============ armado ============ */
const h = P.hero, pr = P.proyecto, df = P.diferencial, sv = P.servicios, ga = P.galeria, ub = P.ubicacion, ci = P.cierre, eq = (P.equipo&&P.equipo.roles&&P.equipo.roles[0])||null;
const com = P.comercializa||{};
const contactos = P.contactos&&P.contactos.length ? P.contactos : [{nombre:P.agente.nombre,whatsapp:P.agente.whatsapp,telefono:'+'+P.agente.whatsapp,mail:P.agente.mail}];
const manzanas = [...new Set(LOTES.map(u=>u.tipologia))];

$('#app').innerHTML = `
<header class="nav sin-marca" id="nav"><div class="in">
  <a class="marca" href="#inicio" aria-label="${esc(P.nombre)}, inicio"><img src="${esc(P.logoNav)}" alt="${esc(P.nombre)}"></a>
  <ul id="menu">
    <li><a href="#proyecto">Proyecto</a></li>
    <li><a href="#masterplan">Masterplan</a></li>
    <li><a href="#galeria">Galería</a></li>
    <li><a href="#ubicacion">Ubicación</a></li>
  </ul>
  <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menú</button>
  <a class="btn btn-linea" href="${wsp(MSG.base)}" target="_blank" rel="noopener">Consultar</a>
</div></header>
${P.modoBorrador?'<div class="borrador">Borrador · no publicar</div>':''}

<main>
<section id="inicio" class="hero">
  <img src="${esc(h.imagen)}" alt="Vista aérea de ${esc(P.nombre)} con el lago Nahuel Huapi y la cordillera" fetchpriority="high">
  <div class="wrap">
    <img class="logo" src="${esc(P.logoHero)}" alt="${esc(P.nombre)}" width="1200" height="500">
    <p class="rotulo">${tx(h.eyebrow)}</p>
    <h1>${tx(h.claim)}</h1>
    <div class="acciones">
      <a class="btn btn-lleno" href="#masterplan">${tx(h.cta1)}</a>
      <a class="btn btn-linea" href="${wsp(MSG.disp)}" target="_blank" rel="noopener">${tx(h.cta2)}</a>
    </div>
  </div>
</section>

<section id="proyecto" class="bloque claro"><div class="wrap">
  <div class="proy-cab">
    <div><p class="rotulo">${tx(pr.eyebrow)}</p><h2>${tx(pr.titulo)}</h2></div>
    <p class="bajada">${tx(pr.texto)}</p>
  </div>
  <div class="cifras">${pr.cifras.map(c=>`<div><strong>${esc(c.valor)}</strong><span>${esc(c.etiqueta)}</span></div>`).join('')}</div>
  <div class="atributos">${pr.atributos.map(a=>`<article class="atr">
    <figure><img src="${esc(a.imagen)}" alt="${esc(a.titulo)}" loading="lazy"></figure>
    <div class="t"><h3>${tx(a.titulo)}</h3><p>${tx(a.texto)}</p></div>

      <div class="lista">${vis.length?vis.map(u=>`<button class="fila ${u.estado}" data-id="${u.id}">
        <i class="pt" style="background:${color(u)}"></i><span class="id">${esc(u.etiqueta)}</span>
        <span class="d">${m2(u.total)}${tieneVista(u)?' · Vista al lago':''}</span>
        <span class="p">${u.estado==='vendido'?'Vendido':u.precio?usd(u.precio):'Consultar'}</span></button>`).join(''):`<div class="vacio">Ningún lote coincide con esos filtros.<button id="limpiar">Quitar filtros</button></div>`}</div>
    </div>`;
    $('#orden').value=st.orden; $('#orden').onchange=e=>{ st.orden=e.target.value; pintarInicio(); };
    const l=$('#limpiar'); if(l) l.onclick=()=>{ st.f=''; st.disp=false; sincronizar(); };
  }
  function pintarFicha(u){
    const vend=u.estado==='vendido';
    const filas=[['Superficie',m2(u.total)],...Object.entries(u.datos||{})].map(([k,val])=>`<div><dt>${esc(k)}</dt><dd>${esc(val)}</dd></div>`).join('');
    panel.innerHTML=`<div class="p-in"><div class="ficha">
      <div class="ficha-top"><span class="est ${esc(u.estado)}">${ESTADOS[u.estado]||'A confirmar'}</span><button class="cerrar" id="cerrar" aria-label="Cerrar la ficha">${ICO.x}</button></div>
      <h3>${esc(u.etiqueta)}</h3><p class="mz">${esc(u.tipologia)} · ${esc(P.nombre)}</p>
      <dl>${filas}</dl>
      ${vend?'':`<div class="precio"><p class="mayus">Precio de lista</p><b>${u.precio?usd(u.precio):'Consultar'}</b></div>`}
      <div class="cta">
        ${vend?`<button class="btn btn-crema" id="ver-disp">Ver lotes disponibles</button>`:`<a class="btn btn-crema" href="${wsp(`Hola, me interesa ${u.nombre} (${u.tipologia}) de ${P.nombre}.`)}" target="_blank" rel="noopener">${ICO.wsp}Consultar por el ${esc(u.nombre)}</a>`}
        <button class="btn btn-fino" id="copiar">Copiar link de este lote</button>
      </div>
    </div></div>`;
    $('#cerrar').onclick=()=>elegir(null);
    $('#copiar').onclick=()=>{ const url=location.href.split('#')[0]+'#'+u.id; (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>avisar('Link copiado'),()=>avisar(url)); };
    const vd=$('#ver-disp'); if(vd) vd.onclick=()=>{ st.disp=true; st.sel=null; history.replaceState(null,'',location.pathname+location.search); sincronizar(); };
  }
  function elegir(id,opts={}){
    st.sel=id; lotes.forEach(l=>l.classList.toggle('sel',l.dataset.id===id)); svg.classList.toggle('hov',!!id);
    const u=porId(id);
    if(u){ anillo.setAttribute('d','M'+u._pts.split(' ').join('L')+'Z'); anillo.hidden=false; pintarFicha(u); if(!opts.sinHash) history.replaceState(null,'','#'+u.id);
      if(opts.irAlPanel&&innerWidth<=1060) setTimeout(()=>panel.scrollIntoView({behavior:MOV_REDUCIDO?'auto':'smooth',block:'nearest'}),200); }
    else { anillo.hidden=true; pintarInicio(); if(location.hash&&LOTES.some(x=>'#'+x.id===location.hash)) history.replaceState(null,'',location.pathname+location.search); }
  }
  function sincronizar(){
    $$('.chip[data-f]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.f===st.f)));
    $('#solo-disp').setAttribute('aria-pressed',String(st.disp));
    lotes.forEach(l=>l.classList.toggle('fuera',!pasa(porId(l.dataset.id))));
    rots.forEach(r=>r.classList.toggle('fuera',!pasa(porId(r.dataset.id))));
    if(st.sel&&!pasa(porId(st.sel))) elegir(null); else if(!st.sel) pintarInicio();
  }
  $$('.chip[data-f]').forEach(c=>c.onclick=()=>{ st.f=c.dataset.f; sincronizar(); });
  $('#solo-disp').onclick=()=>{ st.disp=!st.disp; sincronizar(); };
  gl.addEventListener('click',e=>{ if(arrastro) return; const l=e.target.closest('.lote'); if(l){ tip.classList.remove('on'); elegir(l.dataset.id,{irAlPanel:true}); } });
  gl.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ const l=e.target.closest('.lote'); if(l){ e.preventDefault(); elegir(l.dataset.id,{irAlPanel:true}); } } });
  panel.addEventListener('click',e=>{ const f=e.target.closest('.fila'); if(f) elegir(f.dataset.id); });
  panel.addEventListener('mouseover',e=>{ const f=e.target.closest('.fila'); if(!st.sel) encender(f?f.dataset.id:null); });
  panel.addEventListener('mouseleave',()=>{ if(!st.sel) encender(null); });

  function porHash(){ const id=location.hash.slice(1), u=porId(id); if(u){ elegir(id,{sinHash:true}); setTimeout(()=>$('#masterplan').scrollIntoView(),60); return true; } return false; }
  aplicar(); if(!porHash()) pintarInicio();
  addEventListener('hashchange',porHash);
})();

/* ============ galería ============ */
(function galeria(){
  const tira=$('#tira'), visor=$('#visor'), img=$('#v-img'), cap=$('#v-cap'), fotos=P.galeria.imagenes; let i=0;
  const paso=()=>Math.max(320,tira.clientWidth*0.7);
  $('#g-ant').onclick=()=>tira.scrollBy({left:-paso(),behavior:'smooth'});
  $('#g-sig').onclick=()=>tira.scrollBy({left:paso(),behavior:'smooth'});
  const ver=n=>{ i=(n+fotos.length)%fotos.length; img.src=fotos[i].src; img.alt=fotos[i].alt; cap.textContent=`${fotos[i].alt} · ${i+1} de ${fotos.length}`; };
  tira.addEventListener('click',e=>{ const b=e.target.closest('button[data-i]'); if(!b) return; ver(+b.dataset.i); visor.showModal(); });
  $('#v-x').onclick=()=>visor.close(); $('#v-ant').onclick=()=>ver(i-1); $('#v-sig').onclick=()=>ver(i+1);
  visor.addEventListener('click',e=>{ if(e.target===visor||e.target.classList.contains('v-in')) visor.close(); });
  visor.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') ver(i-1); if(e.key==='ArrowRight') ver(i+1); });
})();

/* ============ ubicación ============ */
(function ubicacion(){
  const sc=$('#mapa-scroll'), svg=$('svg',sc); if(!svg) return;
  $$('.tiempos li').forEach(li=>{ const mk=$(`.mk[data-ref="${li.dataset.ref}"]`,svg); if(!mk) return;
    li.addEventListener('mouseenter',()=>mk.classList.add('on')); li.addEventListener('mouseleave',()=>mk.classList.remove('on')); });
  /* en pantallas chicas el mapa se desplaza: arranca centrado en el loteo */
  const centrar=()=>{ if(sc.scrollWidth>sc.clientWidth+4){ const vb=svg.viewBox.baseVal, pr=$('.proy',svg); const m=/translate\(([\d.]+)/.exec(pr?pr.getAttribute('transform'):''); if(m) sc.scrollLeft=((+m[1]-vb.x)/vb.width)*sc.scrollWidth-sc.clientWidth*0.62; } };
  centrar(); addEventListener('resize',centrar);
})();

/* ============ navegación: sección activa ============ */
(function seccionActiva(){
  const links=$$('.nav ul a'); const mapa=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  const io=new IntersectionObserver(es=>es.forEach(e=>{ const a=mapa.get(e.target.id); if(a&&e.isIntersecting){ links.forEach(l=>l.classList.remove('activo')); a.classList.add('activo'); } }),{rootMargin:'-45% 0px -50% 0px'});
  mapa.forEach((a,id)=>{ const s=document.getElementById(id); if(s) io.observe(s); });
  new IntersectionObserver(es=>{ if(es[0].isIntersecting) links.forEach(l=>l.classList.remove('activo')); },{rootMargin:'-45% 0px -50% 0px'}).observe($('#inicio'));
})();
})();
</script>
