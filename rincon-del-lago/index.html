<style>
/* ======================= BASE (usa las variables de tema.css) ======================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f-texto);color:var(--texto);background:var(--fondo);line-height:1.6;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
section{padding:clamp(72px,10vw,130px) 0}
.eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;font-weight:600;color:var(--acento)}
h1,h2,h3,h4{font-family:var(--f-titulos)}
h2{font-size:clamp(1.9rem,4.4vw,3.1rem);font-weight:var(--peso-titulo,300);line-height:1.12;letter-spacing:-.01em;color:var(--titulo)}
h2 em,h2 b{font-weight:var(--peso-destacado,700);font-style:var(--estilo-destacado,normal);color:var(--destacado,inherit)}
.lead{font-size:clamp(1rem,1.5vw,1.12rem);color:var(--texto2);max-width:58ch}
.completar{display:inline-block;border:1px dashed currentColor;border-radius:6px;padding:0 .4em;font-size:.78em;font-weight:600;color:#c2492f;background:#fff4ef}
body:not(.borrador) .completar,body:not(.borrador) .nota{display:none}
.oscura{background:var(--oscuro);color:var(--sobre-oscuro)}
.oscura h2{color:var(--sobre-oscuro)}
.oscura .lead{color:var(--sobre-oscuro-2)}
.oscura .eyebrow{color:var(--acento2)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.95em 1.5em;border-radius:var(--radio-btn,999px);font-weight:600;font-size:.86rem;letter-spacing:.04em;text-decoration:none;transition:transform .25s,background .25s,color .25s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn-claro{background:#fff;color:var(--oscuro)}
.btn-borde{border:1.5px solid rgba(255,255,255,.7);color:#fff}
.btn-borde:hover{background:rgba(255,255,255,.12)}
.btn-principal{background:var(--boton);color:var(--sobre-boton)}
.btn-wsp{background:#1f7a4d;color:#fff}
.btn svg{width:18px;height:18px;flex:none}

/* Nav */
.nav{position:fixed;inset:0 0 auto;z-index:50;transition:background .35s,box-shadow .35s,padding .35s;padding:18px 0}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}
.marca{color:#fff;text-decoration:none;line-height:1;display:flex;align-items:center}
.marca img{height:34px;width:auto}
.marca b{display:block;font-family:var(--f-titulos);font-weight:700;font-size:1.15rem;letter-spacing:.06em}
.marca span{font-size:.72rem;letter-spacing:.12em;opacity:.8}
.nav ul{display:flex;gap:28px;list-style:none}
.nav ul a{color:#fff;text-decoration:none;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;opacity:.88}
.nav .btn{padding:.7em 1.2em}
.nav.solida{background:var(--nav-fondo);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--linea);padding:12px 0}
.nav.solida .marca,.nav.solida ul a{color:var(--nav-texto)}
.nav.solida .btn-borde{border-color:var(--nav-texto);color:var(--nav-texto)}
.nav .logo-claro{display:block}.nav .logo-oscuro{display:none}
.nav.solida .logo-claro{display:var(--nav-logo-claro,none)}.nav.solida .logo-oscuro{display:var(--nav-logo-oscuro,block)}
@media(max-width:860px){.nav ul{display:none}}

/* Hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;padding:0 0 clamp(48px,8vw,90px);overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:respira 18s ease-out forwards}
@keyframes respira{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.72) 100%)}
.hero .wrap{position:relative;z-index:2}
.hero .eyebrow{color:var(--acento2)}
.hero h1{font-weight:var(--peso-hero,700);font-size:clamp(2.8rem,10vw,7rem);line-height:.95;letter-spacing:var(--tracking-hero,.01em);margin:.2em 0 0}
.hero h1 small{display:block;font-family:var(--f-texto);font-weight:400;font-size:.32em;letter-spacing:.04em;color:var(--acento2);margin-top:.3em}
.hero h1 img{max-height:1.4em;width:auto}
.hero .claim{font-size:clamp(1.05rem,2vw,1.35rem);font-weight:300;margin:1.3em 0 2em;max-width:34ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px}

/* Proyecto */
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(32px,6vw,80px);align-items:end}
@media(max-width:860px){.intro{grid-template-columns:1fr}}
.cifras{display:grid;grid-template-columns:repeat(var(--n,4),1fr);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);margin-top:clamp(48px,7vw,80px)}
.cifra{padding:28px 18px;border-right:1px solid var(--linea)}
.cifra:last-child{border-right:0}
.cifra strong{display:block;font-family:var(--f-titulos);font-size:clamp(1.5rem,3.2vw,2.5rem);font-weight:700;color:var(--titulo);line-height:1.05}
.cifra span{font-size:.78rem;color:var(--texto2)}
@media(max-width:860px){.cifras{grid-template-columns:repeat(2,1fr)}.cifra:nth-child(2n){border-right:0}.cifra{border-bottom:1px solid var(--linea)}}
.atributos{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:clamp(48px,7vw,80px)}
@media(max-width:860px){.atributos{grid-template-columns:1fr}}
.attr{background:var(--superficie);border-radius:var(--radio);overflow:hidden;box-shadow:var(--sombra)}
.attr img{aspect-ratio:4/3;object-fit:cover;width:100%}
.attr div{padding:22px 24px 26px}
.attr h3{font-size:1.05rem;font-weight:700;color:var(--titulo);margin-bottom:.4em}
.attr p{font-size:.93rem;color:var(--texto2)}

/* Diferencial */
.dif{position:relative;color:#fff;padding:0;min-height:88vh;display:flex;align-items:center;overflow:hidden}
.dif>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dif::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.45) 45%,rgba(0,0,0,0) 75%);z-index:1}
.dif .wrap{position:relative;z-index:2;padding:90px 0}
.dif h2{color:#fff;max-width:15ch}
.dif .lead{color:rgba(255,255,255,.86);margin-top:1.2em}
.dif .eyebrow{color:var(--acento2)}
.pin{display:flex;gap:30px;margin-top:2.2em;flex-wrap:wrap}
.pin strong{display:block;font-family:var(--f-titulos);font-size:2rem;font-weight:700}
.pin span{font-size:.78rem;letter-spacing:.06em;color:var(--acento2)}

/* Explorador */
#unidades{background:var(--fondo2)}
.exp-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.contadores{display:flex;gap:10px;flex-wrap:wrap}
.cont{background:var(--superficie);border-radius:12px;padding:12px 16px;min-width:118px}
.cont strong{display:block;font-size:1.3rem;color:var(--titulo);font-weight:700;line-height:1.1}
.cont span{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--texto2)}
@media(max-width:600px){.contadores{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.cont{min-width:0}}
.barra{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
.tabs{display:inline-flex;background:var(--superficie);border-radius:999px;padding:5px;gap:4px;flex-wrap:wrap}
.tab{padding:.6em 1.15em;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--texto2)}
.tab[aria-selected=true]{background:var(--boton);color:var(--sobre-boton)}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--linea);background:var(--superficie);border-radius:999px;padding:.45em 1em;font-size:.78rem;color:var(--texto2)}
.chip[aria-pressed=true]{border-color:var(--titulo);color:var(--titulo);font-weight:700}
.exp{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr);gap:22px;align-items:start}
.exp>div{min-width:0}
@media(max-width:960px){.exp{grid-template-columns:minmax(0,1fr)}}
.lienzo{position:relative;background:var(--superficie);border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden}
.lienzo-scroll{overflow:auto;max-height:80vh;-webkit-overflow-scrolling:touch}
.lienzo-in{display:flex;justify-content:center;padding:18px;width:max-content;min-width:100%}
.lienzo svg{display:block;height:var(--alto,640px);width:auto}
.lienzo img.plano-solo{width:100%;padding:18px;cursor:zoom-in}
.uf{fill:transparent;stroke:transparent;stroke-width:5;cursor:pointer;transition:fill .2s,stroke .2s}
.uf:hover,.uf:focus{fill:color-mix(in srgb,var(--titulo) 20%,transparent);stroke:var(--titulo);outline:none}
.uf.activa{fill:color-mix(in srgb,var(--titulo) 30%,transparent);stroke:var(--titulo);stroke-width:7}
.uf.vendido{fill:rgba(154,59,59,.45)}
.uf.reservado{fill:rgba(196,138,42,.38)}
.uf.apagada{fill:rgba(240,240,240,.82);pointer-events:none}
.uf-tag{font-family:var(--f-texto);font-weight:800;fill:var(--titulo);pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:7px}
.controles{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.controles button{width:38px;height:38px;border-radius:10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:1.1rem;font-weight:700;color:#1d2428}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:.74rem;color:var(--texto2);margin-top:12px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.aclara{font-size:.74rem;color:var(--texto2);margin-top:10px}
.lista-uf{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.lista-uf button{background:var(--superficie);border:1.5px solid var(--linea);border-radius:10px;padding:.5em .8em;font-size:.78rem;font-weight:600;color:var(--titulo)}
.lista-uf button.activa{background:var(--boton);color:var(--sobre-boton);border-color:var(--boton)}
.lista-uf button[hidden]{display:none}
.lienzo:fullscreen{border-radius:0}.lienzo:fullscreen .lienzo-scroll{max-height:100vh;height:100vh}
/* Ficha */
.ficha{background:var(--superficie);border-radius:var(--radio);box-shadow:var(--sombra);padding:26px;position:sticky;top:90px;color:var(--texto)}
.ficha .vacia{color:var(--texto2);font-size:.95rem}
.ficha .vacia strong{display:block;color:var(--titulo);font-size:1.15rem;margin-bottom:.4em}
.ficha h3{font-size:1.7rem;font-weight:800;color:var(--titulo);line-height:1.1;margin-top:.5em}
.ficha .sub{font-size:.85rem;color:var(--texto2);margin:.3em 0 1em}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.35em .8em;border-radius:999px;background:var(--fondo2)}
.estado::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.estado.disponible{color:#3f8a5c}.estado.reservado{color:#c48a2a}.estado.vendido{color:#9a3b3b}.estado.a-confirmar{color:#7d8a93}
.tabla{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem}
.tabla td{padding:9px 0;border-bottom:1px solid var(--linea)}
.tabla td:last-child{text-align:right;font-weight:600}
.tabla tr.total td{border-bottom:0;font-weight:800;color:var(--titulo);font-size:1.02rem}
.precio{display:flex;justify-content:space-between;align-items:baseline;background:var(--fondo2);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.precio span{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--texto2)}
.precio strong{font-size:1.3rem;color:var(--titulo)}
.mini-plano{border:1px solid var(--linea);border-radius:10px;overflow:hidden;cursor:zoom-in;margin-bottom:12px;background:#fff}
.mini-plano img{width:100%;aspect-ratio:3/2;object-fit:contain}
.acciones{display:grid;gap:10px}
.btn-link{font-size:.8rem;color:var(--titulo);text-decoration:underline;text-underline-offset:3px;justify-self:center;padding:4px}
.nota{font-size:.75rem;color:#b4462f;background:#fff4ef;border-radius:8px;padding:8px 10px;margin-top:10px}
.cerrar{display:none;position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--fondo2);align-items:center;justify-content:center;font-size:1.2rem}
.asa{display:none}
@media(max-width:960px){
  .ficha{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;border-radius:20px 20px 0 0;max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
  .ficha.abierta{transform:none}.ficha .cerrar{display:flex}.ficha .vacia{display:none}
  .asa{display:block;width:44px;height:5px;border-radius:9px;background:var(--linea);margin:-6px auto 14px}
}
.velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
@media(max-width:960px){.velo.on{opacity:1;pointer-events:auto}}
/* Tarjetas (niveles sin polígonos: tipologías) */
.tarjetas-nivel{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:960px){.tarjetas-nivel{grid-template-columns:1fr}}
.tipos{display:grid;gap:16px}
.tipo{background:var(--superficie);border-radius:var(--radio);box-shadow:var(--sombra);padding:22px;border-left:6px solid var(--acento)}
.tipo h3{font-size:1.2rem;color:var(--titulo);font-weight:800;margin-top:.5em}
.tipo .acciones{display:flex;gap:10px;flex-wrap:wrap}
.tipo.activa{outline:3px solid var(--titulo);outline-offset:3px}

/* Servicios */
.amen{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:40px}
@media(max-width:860px){.amen{grid-template-columns:repeat(2,1fr)}}
.am{border-top:2px solid var(--titulo);padding-top:16px}
.am svg{width:30px;height:30px;stroke:var(--titulo);fill:none;stroke-width:1.5;margin-bottom:10px}
.am h3{font-size:.98rem;color:var(--titulo);font-weight:700;font-family:var(--f-texto)}
.am p{font-size:.86rem;color:var(--texto2)}

/* Galería */
.carrusel{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px max(20px,calc((100vw - 1180px)/2)) 10px;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}
.carrusel figure{flex:0 0 min(78vw,760px);scroll-snap-align:center;border-radius:var(--radio);overflow:hidden;cursor:zoom-in;position:relative}
.carrusel img{width:100%;aspect-ratio:3/2;object-fit:cover;transition:transform .6s}
.carrusel figure:hover img{transform:scale(1.03)}
.carrusel figcaption{position:absolute;left:14px;bottom:12px;font-size:.74rem;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:999px}
.gal-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.gal-nav div{display:flex;gap:10px}
.gal-nav button{width:46px;height:46px;border-radius:50%;border:1.5px solid currentColor;font-size:1.2rem;opacity:.85}
.gal-nav small{font-size:.74rem;opacity:.7}
.lb{position:fixed;inset:0;background:rgba(8,12,14,.94);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:88vh;border-radius:8px;background:#fff}
.lb button{position:absolute;color:#fff;font-size:1.6rem;width:52px;height:52px}
.lb .x{top:10px;right:10px}.lb .ant{left:6px;top:50%}.lb .sig{right:6px;top:50%}

/* Ubicación (mapa dibujado) */
.ubi-head{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,70px);align-items:end;margin-bottom:34px}
@media(max-width:860px){.ubi-head{grid-template-columns:1fr}}
.mapa{position:relative;border-radius:22px;overflow:hidden;background:var(--m-agua);box-shadow:var(--sombra)}
.mapa-scroll{overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mapa-scroll::-webkit-scrollbar{display:none}
.mapa-svg{display:block;width:var(--mw,100%);height:auto;font-family:var(--f-texto)}
.agua path{fill:var(--m-agua)}
.curvas path{fill:none;stroke:var(--m-curva);stroke-width:1}
.curvas path.cv-m{stroke:var(--m-curva-m)}
.r-min path{fill:none;stroke:var(--m-calle);stroke-width:1.1;stroke-linecap:round}
.r-may path{fill:none;stroke:var(--m-calle-m);stroke-width:2.2;stroke-linecap:round}
.r-40 path{fill:none;stroke:var(--m-ruta);stroke-width:3.8;stroke-linecap:round}
.ruta{fill:none;stroke:var(--m-acento);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:1 11;animation:avanza 1.4s linear infinite}
.ruta.sec{opacity:.55}
@keyframes avanza{to{stroke-dashoffset:-24}}
.m-lago{font-size:40px;font-weight:300;font-style:italic;letter-spacing:.45em;fill:var(--m-rotulo)}
.m-zona{font-size:13px;letter-spacing:.32em;fill:var(--m-acento);font-weight:600}
.mk{cursor:pointer}
.mk-c{fill:var(--m-marcador);stroke:rgba(255,255,255,.55);stroke-width:1.5;transition:fill .25s}
.mk-i path,.mk-i circle{fill:none;stroke:#fff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.mk.on .mk-c,.mk:hover .mk-c{stroke:var(--m-acento);stroke-width:3}
.mk-t{fill:#fff;font-size:15px;font-weight:700;letter-spacing:.16em}
.mk-s{fill:rgba(255,255,255,.75);font-size:13px}
.halo{paint-order:stroke;stroke:var(--m-halo);stroke-width:4px;stroke-linejoin:round}
.proy-p{fill:var(--m-acento)}
.proy-a{fill:none;stroke:var(--m-acento);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:late 2.4s ease-out infinite}
@keyframes late{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
.proy-card rect{fill:var(--m-tarjeta);stroke:var(--m-acento);stroke-opacity:.7}
.proy-l{fill:none;stroke:var(--m-acento);stroke-width:1.2}
.pc-t{fill:#fff;font-family:var(--f-titulos);font-size:28px;font-weight:700;letter-spacing:.06em}
.pc-s{fill:var(--m-acento);font-size:10.5px;letter-spacing:.2em;font-weight:500}
.flecha path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.m-attr{fill:rgba(255,255,255,.45);font-size:10px}
.mapa .controles{top:16px;right:16px}
.mapa-info{position:absolute;left:18px;bottom:40px;width:280px;background:var(--m-tarjeta);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px 20px;color:#fff;backdrop-filter:blur(6px)}
.mapa-info h4{font-family:var(--f-texto);font-size:.68rem;letter-spacing:.24em;color:var(--m-acento);font-weight:600;margin-bottom:10px;text-transform:uppercase}
.mapa-info ul{list-style:none}
.mapa-info li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:.84rem;cursor:pointer}
.mapa-info li:last-child{border-bottom:0}
.mapa-info li b{color:var(--m-acento);white-space:nowrap}
.mapa-info small{display:block;margin-top:10px;font-size:.7rem;color:rgba(255,255,255,.55)}
@media(max-width:860px){.mapa-scroll{max-height:68vh}.mapa-info{position:static;width:auto;border-radius:0;border:0;border-top:1px solid rgba(255,255,255,.1)}}

/* Equipo */
.equipo{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:20px;margin-top:36px}
@media(max-width:860px){.equipo{grid-template-columns:1fr}}
.rol{background:var(--superficie);border-radius:var(--radio);padding:26px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.rol span{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--texto2)}
.rol strong{font-family:var(--f-titulos);font-size:1.35rem;color:var(--titulo);font-weight:700;letter-spacing:.03em}
.rol img{height:34px;width:auto;object-fit:contain;object-position:left}

/* Cierre */
.cierre{position:relative;color:#fff;text-align:center;min-height:80vh;display:flex;align-items:center;overflow:hidden}
.cierre>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cierre::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:1}
.cierre .wrap{position:relative;z-index:2}
.cierre h2{color:#fff;margin:0 auto .5em;max-width:18ch}
.cierre .lead{color:rgba(255,255,255,.85);margin:0 auto 2em}
.cierre .eyebrow{color:var(--acento2)}
.cierre .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* Footer */
footer{background:var(--pie);color:rgba(255,255,255,.78);padding:56px 0 calc(90px + env(safe-area-inset-bottom));font-size:.84rem}
footer .grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:30px}
@media(max-width:860px){footer .grid{grid-template-columns:1fr}}
footer img{height:30px;width:auto;margin-bottom:14px}
footer a{color:#fff;text-decoration:none}
footer h4{font-family:var(--f-texto);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--acento2);margin-bottom:10px;font-weight:600}
footer .legal{border-top:1px solid rgba(255,255,255,.12);margin-top:36px;padding-top:20px;font-size:.72rem;color:rgba(255,255,255,.55)}
.wsp-flot{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;width:58px;height:58px;border-radius:50%;background:#1f7a4d;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.28)}
.wsp-flot svg{width:30px;height:30px;fill:#fff}

.rev{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.rev.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none}.hero>img{animation:none}.ruta,.proy-a{animation:none}}
</style>

<script>

const wspNum = (P.agente&&P.agente.whatsapp||'').replace(/\D/g,'');

const m2 = n => (+n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})+' m²';
const usd = n => 'USD '+(+n).toLocaleString('es-AR');
const ESTADOS = {'disponible':'Disponible','reservado':'Reservado','vendido':'Vendido','a-confirmar':'A confirmar'};
const SUP = {cubiertos:'Cubiertos',semicubiertos:'Semicubiertos',descubiertos:'Descubiertos',deck:'Deck exterior',terreno:'Terreno',total_construible:'Construible'};

const ICO = {

};

/* ======================= SECCIONES ======================= */
const S = {};
S.hero = h => `<section class="hero" id="inicio">
  <img src="${esc(h.imagen)}" alt="${esc(h.alt||P.nombre)}" fetchpriority="high">
  <div class="wrap">
    ${h.eyebrow?`<p class="eyebrow">${tx(h.eyebrow)}</p>`:''}
    <h1>${P.logoHero?`<img src="${esc(P.logoHero)}" alt="${esc(P.nombre)}">`:esc(h.titulo||P.nombre)}${P.bajada?`<small>${esc(P.bajada)}</small>`:''}</h1>
    ${h.claim?`<p class="claim">${tx(h.claim)}</p>`:''}
    <div class="ctas">
      ${P.explorador?`<a class="btn btn-claro" href="#unidades">${esc(h.cta1||'Ver las unidades')}</a>`:''}
      <a class="btn btn-borde" data-wsp="${esc(`Hola, quiero consultar la disponibilidad de ${P.nombre}.`)}" href="#">${esc(h.cta2||'Consultar disponibilidad')}</a>
    </div>
  </div></section>`;

S.proyecto = p => `<section id="proyecto"><div class="wrap">
  <div class="intro rev"><div><p class="eyebrow">${tx(p.eyebrow||'El proyecto')}</p><h2>${tx(p.titulo)}</h2></div><p class="lead">${tx(p.texto)}</p></div>
  ${p.cifras&&p.cifras.length?`<div class="cifras rev" style="--n:${Math.min(p.cifras.length,5)}">${p.cifras.map(c=>`<div class="cifra"><strong>${tx(c.valor)}</strong><span>${tx(c.etiqueta)}</span></div>`).join('')}</div>`:''}

  <div class="wrap gal-nav"><small>${tx(g.aclaracion||'Renders ilustrativos, no contractuales.')}</small><div><button aria-label="Anterior" id="g-ant">←</button><button aria-label="Siguiente" id="g-sig">→</button></div></div></section>`;

S.ubicacion = u => `<section id="ubicacion"><div class="wrap">
  <div class="ubi-head rev"><div><p class="eyebrow">${tx(u.eyebrow||'Ubicación')}</p><h2>${tx(u.titulo)}</h2></div><p class="lead">${tx(u.texto)}</p></div>
  <div class="mapa rev" id="mapa"><div class="controles"><button aria-label="Acercar" data-mz="1">+</button><button aria-label="Alejar" data-mz="-1">−</button></div>
    <div class="mapa-scroll" id="mapa-scroll"></div>
    ${u.tiempos&&u.tiempos.length?`<div class="mapa-info"><h4>Desde ${esc(P.nombre)}</h4><ul>${u.tiempos.map(t=>`<li data-ref="${esc(t.id||'')}"><span>${esc(t.nombre)}</span><b>${esc(t.tiempo)}</b></li>`).join('')}</ul><small>${esc(u.nota_tiempos||'Tiempos aproximados en auto.')}</small></div>`:''}
  </div></div></section>`;

S.equipo = q => `<section id="equipo" style="background:var(--fondo2)"><div class="wrap"><p class="eyebrow rev">${tx(q.eyebrow||'Quiénes lo hacen')}</p><h2 class="rev">${tx(q.titulo||'Un proyecto con *nombre y apellido.*')}</h2>
  <div class="equipo" style="--n:${Math.min(q.roles.length,4)}">${q.roles.map(r=>`<div class="rol rev"><span>${esc(r.rol)}</span>${r.logo?`<img src="${esc(r.logo)}" alt="${esc(r.nombre)}">`:`<strong>${esc(r.nombre)}</strong>`}</div>`).join('')}</div></div></section>`;

S.cierre = c => `<section class="cierre"><img src="${esc(c.imagen)}" alt="" loading="lazy"><div class="wrap rev">
  <p class="eyebrow">${tx(c.eyebrow||'Inversión')}</p><h2>${tx(c.titulo)}</h2><p class="lead">${tx(c.texto)}</p>
  <div class="ctas"><a class="btn btn-claro" data-wsp="${esc(`Hola, quiero recibir precios y formas de pago de ${P.nombre}.`)}" href="#">${esc(c.cta1||'Recibir precios')}</a>
  <a class="btn btn-borde" data-wsp="${esc(`Hola, quiero coordinar una visita a ${P.nombre}.`)}" href="#">${esc(c.cta2||'Coordinar una visita')}</a></div></div></section>`;

/* ---------- Armado de la página ---------- */
const navItems = [['proyecto','Proyecto'],['unidades','Unidades'],['galeria','Galería'],['ubicacion','Ubicación']];
const fuente = {hero:P.hero,proyecto:P.proyecto,diferencial:P.diferencial,explorador:P.explorador,servicios:P.servicios,galeria:P.galeria,ubicacion:P.ubicacion,equipo:P.equipo,cierre:P.cierre};
const orden = P.secciones || ['hero','proyecto','diferencial','explorador','servicios','galeria','ubicacion','equipo','cierre'];
let html = `<header class="nav" id="nav"><div class="wrap">
  <a class="marca" href="#inicio">${P.logoNav?`<img class="logo-claro" src="${esc(P.logoNav)}" alt="${esc(P.nombre)}">${P.logoNavOscuro?`<img class="logo-oscuro" src="${esc(P.logoNavOscuro)}" alt="">`:''}`:`<span><b>${esc(P.nombre.toUpperCase())}</b>${P.bajada?`<span>${esc(P.bajada)}</span>`:''}</span>`}</a>
  <nav><ul>${navItems.filter(([id])=>orden.includes(id==='unidades'?'explorador':id)&&fuente[id==='unidades'?'explorador':id]).map(([id,t])=>`<li><a href="#${id}">${t}</a></li>`).join('')}</ul></nav>
  <a class="btn btn-borde" data-wsp="${esc(msgBase)}" href="#">Consultar</a></div></header>`;
orden.forEach(k=>{ if(fuente[k] && S[k]) html += S[k](fuente[k]); });
const pat = P.comercializa || {};
html += `<footer><div class="wrap"><div class="grid">
  <div><img src="img/patagonica-blanco.png" alt="Patagónica Propiedades"><p>${esc(pat.direccion||'Cerro Bayo 69, Of. 3 · Villa La Angostura, Neuquén')}</p></div>
  <div><h4>Contacto</h4><p>${tx(P.agente.nombre)}</p><p><a data-wsp="${esc(msgBase)}" href="#">WhatsApp</a> · <a href="mailto:${esc(P.agente.mail)}">${esc(P.agente.mail)}</a></p></div>
  <div><h4>Seguinos</h4><p><a href="${esc(pat.instagram||'https://www.instagram.com/patagonicapropiedades/')}" target="_blank" rel="noopener">Instagram</a></p></div></div>
  <p class="legal">${tx(P.legal||'Las imágenes, renders y planos son ilustrativos y no contractuales. Superficies y medidas sujetas a planos definitivos. Precios y disponibilidad pueden variar sin previo aviso.')} © ${new Date().getFullYear()} Patagónica Propiedades.</p></div></footer>
  <a class="wsp-flot" data-wsp="${esc(msgBase)}" href="#" aria-label="Escribinos por WhatsApp">${icoWsp}</a>`;
$('#app').innerHTML = html;

/* ---------- WhatsApp: todos los CTA ---------- */
function activarWsp(root){ (root||document).querySelectorAll('[data-wsp]').forEach(a=>{a.href=wsp(a.dataset.wsp);a.target='_blank';a.rel='noopener';}); }
activarWsp();

/* ======================= EXPLORADOR ======================= */
const E = P.explorador;
const velo = $('#velo');
let ficha = null;
if(E){
  const todas = E.niveles.flatMap(n=>n.unidades.map(u=>({...u,_nivel:n})));
  const conEstado = todas.filter(u=>u.estado && u.estado!=='a-confirmar');
  const precios = todas.filter(u=>u.precio && u.estado!=='vendido').map(u=>+u.precio);
  $('#c-disp').textContent = conEstado.length ? todas.filter(u=>u.estado==='disponible').length : '—';
  $('#c-vend').textContent = conEstado.length ? todas.filter(u=>u.estado==='vendido').length : '—';
  $('#c-desde').textContent = precios.length ? usd(Math.min(...precios)) : 'Consultar';

  const filtros = {tipo:'Todas', disp:false};
  let actual = 0, alto = 0;

  function fichaHTML(u, n){
    const filas = Object.entries(u.sup||{}).map(([k,v])=>`<tr><td>${SUP[k]||esc(k)}</td><td>${m2(v)}</td></tr>`).join('')
      + Object.entries(u.datos||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
    const msg = `Hola, me interesa ${u.nombre}${u.tipologia?' ('+u.tipologia+')':''} de ${P.nombre}.`;
    return `<div class="asa"></div><button class="cerrar" aria-label="Cerrar">✕</button>
      <span class="estado ${esc(u.estado||'a-confirmar')}">${ESTADOS[u.estado]||'A confirmar'}</span>
      <h3>${esc(u.nombre)}</h3><p class="sub">${esc(n.nombre)}${u.tipologia?' · '+esc(u.tipologia):''}</p>
      ${u.plano?`<div class="mini-plano" data-lb="${esc(u.plano)}"><img src="${esc(u.plano)}" alt="Plano ${esc(u.nombre)}" loading="lazy"></div>`:''}
      <table class="tabla">${filas}${u.total?`<tr class="total"><td>Total</td><td>${m2(u.total)}</td></tr>`:''}</table>
      <div class="precio"><span>Precio de lista</span><strong>${u.precio?usd(u.precio):'Consultar'}</strong></div>
      <div class="acciones"><a class="btn btn-wsp" href="${wsp(msg)}" target="_blank" rel="noopener">${icoWsp}Consultar por esta unidad</a>
      <button class="btn-link" data-copiar="${esc(u.id)}">Copiar link de esta unidad</button></div>
      ${u.nota?`<p class="nota">${esc(u.nota)}</p>`:''}`;
  }

  function base(){ const l=$('#lienzo'); if(!l) return 600; const n=E.niveles[actual]; return Math.min(680, innerHeight*.72, (l.clientWidth-60)/(n.w/n.h)); }
  function setAlto(h){ const b=base(); alto=Math.max(b*.8,Math.min(h,b*3)); const s=$('#lienzo svg'); if(s) s.style.setProperty('--alto',alto+'px'); }

  function pintarNivel(){
    const n = E.niveles[actual];
    const tipos = [...new Set(n.unidades.map(u=>u.tipologia).filter(Boolean))];
    const conPoli = n.unidades.some(u=>u.poligono);
    $('#filtros').innerHTML = conPoli && tipos.length>1 ? ['Todas',...tipos].map(t=>`<button class="chip" data-f="tipo" data-v="${esc(t)}" aria-pressed="${filtros.tipo===t}">${esc(t)}</button>`).join('')+`<button class="chip" data-f="disp" aria-pressed="${filtros.disp}">Solo disponibles</button>` : '';
    if(conPoli){
      const pol = n.unidades.filter(u=>u.poligono).map(u=>{
        const pts=u.poligono.trim().split(/\s+/).map(p=>p.split(',').map(Number));
        const cx=pts.reduce((a,p)=>a+p[0],0)/pts.length, cy=pts.reduce((a,p)=>a+p[1],0)/pts.length;
        const fs = Math.max(18, Math.round(n.w/22));
        return `<polygon class="uf ${esc(u.estado||'')}" data-id="${esc(u.id)}" points="${esc(u.poligono)}" tabindex="0" role="button" aria-label="${esc(u.nombre)}"><title>${esc(u.nombre)}${u.tipologia?' · '+esc(u.tipologia):''}</title></polygon><text class="uf-tag" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}">${esc(u.etiqueta||u.nombre.replace(/^\D+/,''))}</text>`;
      }).join('');
      $('#nivel').innerHTML = `<div class="exp"><div>
        <div class="lienzo" id="lienzo"><div class="controles"><button aria-label="Acercar" data-zoom="1">+</button><button aria-label="Alejar" data-zoom="-1">−</button><button aria-label="Pantalla completa" id="fs">⤢</button></div>
          <div class="lienzo-scroll"><div class="lienzo-in"><svg viewBox="0 0 ${n.w} ${n.h}" role="img" aria-label="${esc(n.nombre)}"><image href="${esc(n.plano)}" width="${n.w}" height="${n.h}"/>${pol}</svg></div></div></div>
        <div class="leyenda"><span><i style="background:#3f8a5c"></i>Disponible</span><span><i style="background:#c48a2a"></i>Reservado</span><span><i style="background:#9a3b3b"></i>Vendido</span><span><i style="background:#7d8a93"></i>A confirmar</span></div>
        <div class="lista-uf" id="lista-uf">${n.unidades.map(u=>`<button data-id="${esc(u.id)}">${esc(u.nombre)}${u.tipologia?' · '+esc(u.tipologia):''}</button>`).join('')}</div>
        ${n.nota?`<p class="aclara">${tx(n.nota)}</p>`:''}
      </div><aside class="ficha" id="ficha" aria-live="polite"><div class="vacia"><strong>Seleccioná una unidad</strong>Tocá cualquier unidad del plano para ver su ficha completa y consultar por ella.</div></aside></div>`;
      ficha = $('#ficha');
      setAlto(base()); requestAnimationFrame(()=>setAlto(base()));
      $$('[data-zoom]').forEach(b=>b.onclick=()=>setAlto(alto*(b.dataset.zoom>0?1.35:1/1.35)));
      $('#fs').onclick=()=>{ const l=$('#lienzo'); document.fullscreenElement?document.exitFullscreen():(l.requestFullscreen&&l.requestFullscreen()); };
      const sc=$('.lienzo-scroll'); let d0=null,a0=0;
      sc.addEventListener('touchstart',e=>{ if(e.touches.length===2){ d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); a0=alto; }},{passive:true});
      sc.addEventListener('touchmove',e=>{ if(e.touches.length===2&&d0){ e.preventDefault(); setAlto(a0*Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/d0); }},{passive:false});
      sc.addEventListener('touchend',()=>d0=null);
      aplicarFiltros();
    } else {
      $('#nivel').innerHTML = `<div class="tarjetas-nivel"><div>
        ${n.plano?`<div class="lienzo"><img class="plano-solo" src="${esc(n.plano)}" alt="${esc(n.nombre)}" data-lb="${esc(n.plano)}"></div>`:''}
        ${n.nota?`<p class="aclara">${tx(n.nota)}</p>`:''}</div>
        <div class="tipos">${n.unidades.map(u=>{ const filas=Object.entries(u.sup||{}).map(([k,v])=>`<tr><td>${SUP[k]||esc(k)}</td><td>${m2(v)}</td></tr>`).join('');
          return `<article class="tipo" id="${esc(u.id)}" style="${u.color?'border-left-color:'+esc(u.color):''}"><span class="estado ${esc(u.estado||'a-confirmar')}">${ESTADOS[u.estado]||'A confirmar'}</span>
          <h3>${esc(u.nombre)}${u.tipologia?' · '+esc(u.tipologia):''}</h3><table class="tabla">${filas}${u.total?`<tr class="total"><td>Total</td><td>${m2(u.total)}</td></tr>`:''}</table>
          <div class="precio"><span>Precio de lista</span><strong>${u.precio?usd(u.precio):'Consultar'}</strong></div>
          <div class="acciones">${u.plano?`<button class="btn btn-principal" data-lb="${esc(u.plano)}">Ver plano</button>`:''}<a class="btn btn-wsp" href="${wsp(E.niveles.length>1?`Hola, me interesa ${u.nombre} de ${n.nombre} — ${P.nombre}.`:`Hola, me interesa la ${u.nombre} de ${P.nombre}.`)}" target="_blank" rel="noopener">${icoWsp}Consultar</a><button class="btn-link" data-copiar="${esc(u.id)}">Copiar link</button></div></article>`; }).join('')}</div></div>`;
      ficha = null;
    }
  }
  function aplicarFiltros(){
    E.niveles[actual].unidades.forEach(u=>{
      const ok=(filtros.tipo==='Todas'||u.tipologia===filtros.tipo)&&(!filtros.disp||u.estado==='disponible');
      $$(`.uf[data-id="${CSS.escape(u.id)}"]`).forEach(p=>p.classList.toggle('apagada',!ok));
      const b=$(`#lista-uf button[data-id="${CSS.escape(u.id)}"]`); if(b) b.hidden=!ok;
    });
  }
  function irNivel(i){ actual=i; filtros.tipo='Todas'; $$('#tabs .tab').forEach(t=>t.setAttribute('aria-selected', +t.dataset.n===i)); pintarNivel(); }
  function abrir(id, scroll){
    const u = todas.find(x=>x.id===id); if(!u) return;
    const i = E.niveles.indexOf(u._nivel); if(i!==actual) irNivel(i);
    if(!ficha){ const el=document.getElementById(id); if(el){ $$('.tipo').forEach(t=>t.classList.remove('activa')); el.classList.add('activa'); setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),150);} return; }
    $$('.uf').forEach(p=>p.classList.toggle('activa',p.dataset.id===id));
    $$('#lista-uf button').forEach(b=>b.classList.toggle('activa',b.dataset.id===id));
    ficha.innerHTML = fichaHTML(u, u._nivel); ficha.classList.add('abierta'); velo.classList.add('on');
    history.replaceState(null,'','#'+id);
    if(scroll) $('#unidades').scrollIntoView({behavior:'smooth'});
  }
  const cerrar=()=>{ if(ficha) ficha.classList.remove('abierta'); velo.classList.remove('on'); };
  velo.onclick=cerrar;
  document.addEventListener('click',e=>{
    const t=e.target;
    if(t.closest('.cerrar')) return cerrar();
    const p=t.closest('.uf'); if(p) return abrir(p.dataset.id);
    const lb=t.closest('#lista-uf button'); if(lb) return abrir(lb.dataset.id);
    const tab=t.closest('#tabs .tab'); if(tab) return irNivel(+tab.dataset.n);
    const ch=t.closest('.chip'); if(ch){ if(ch.dataset.f==='tipo') filtros.tipo=ch.dataset.v; else filtros.disp=!filtros.disp; pintarNivel(); }
  });
  document.addEventListener('keydown',e=>{ const p=e.target.closest&&e.target.closest('.uf'); if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();abrir(p.dataset.id);} if(e.key==='Escape') cerrar(); });
  addEventListener('resize',()=>{ if(!document.fullscreenElement) setAlto(base()); });
  document.addEventListener('fullscreenchange',()=>setAlto(document.fullscreenElement?innerHeight-60:base()));
  pintarNivel();
  window.__abrirUnidad = abrir;
}

/* Copiar link de unidad */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-copiar]'); if(!c) return;
  const url=location.href.split('#')[0]+'#'+c.dataset.copiar;
  const ok=()=>{const t=c.textContent;c.textContent='¡Link copiado!';setTimeout(()=>c.textContent=t,1600)};
  try{navigator.clipboard.writeText(url).then(ok,()=>prompt('Copiá el link:',url))}catch(_){prompt('Copiá el link:',url)}
});

/* ======================= GALERÍA + LIGHTBOX ======================= */
const lb=$('#lb'), lbImg=lb.querySelector('img'); let lista=[], idx=0;
function lbAbrir(arr,i){ lista=arr; idx=i; lbImg.src=lista[idx]; lb.classList.add('on'); lb.querySelector('.ant').hidden=lb.querySelector('.sig').hidden=arr.length<2; }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-lb]'); if(!t) return; const g=t.parentElement?[...t.parentElement.children].filter(x=>x.dataset&&x.dataset.lb):[t]; lbAbrir(g.map(x=>x.dataset.lb),Math.max(0,g.indexOf(t))); });
const car=$('#carrusel');
if(car){ car.addEventListener('click',e=>{ const f=e.target.closest('figure'); if(f) lbAbrir(P.galeria.imagenes.map(g=>g.src),+f.dataset.i); });
  const paso=()=>car.querySelector('figure').offsetWidth+16;
  $('#g-ant').onclick=()=>car.scrollBy({left:-paso(),behavior:'smooth'}); $('#g-sig').onclick=()=>car.scrollBy({left:paso(),behavior:'smooth'}); }
lb.querySelector('.x').onclick=()=>lb.classList.remove('on');
lb.querySelector('.ant').onclick=()=>{idx=(idx-1+lista.length)%lista.length;lbImg.src=lista[idx]};
lb.querySelector('.sig').onclick=()=>{idx=(idx+1)%lista.length;lbImg.src=lista[idx]};
lb.addEventListener('click',e=>{ if(e.target===lb) lb.classList.remove('on'); });
document.addEventListener('keydown',e=>{ if(!lb.classList.contains('on')) return; if(e.key==='Escape') lb.classList.remove('on'); if(lista.length>1&&e.key==='ArrowLeft') lb.querySelector('.ant').click(); if(lista.length>1&&e.key==='ArrowRight') lb.querySelector('.sig').click(); });
let lbX=null; lb.addEventListener('touchstart',e=>{lbX=e.touches[0].clientX},{passive:true}); lb.addEventListener('touchend',e=>{ if(lbX===null||lista.length<2) return; const dx=e.changedTouches[0].clientX-lbX; lbX=null; if(Math.abs(dx)>45) lb.querySelector(dx<0?'.sig':'.ant').click(); });

/* ======================= MAPA ======================= */
const ms=$('#mapa-scroll'), tpl=$('#tpl-mapa');
if(ms && tpl && tpl.innerHTML.trim().startsWith('<svg')){
  ms.innerHTML = tpl.innerHTML;
  const svg=ms.querySelector('svg'); let z=1;
  const ancho=()=> innerWidth<860 ? Math.max(ms.clientWidth*1.9,720) : ms.clientWidth;
  const aplicar=()=>svg.style.setProperty('--mw',(ancho()*z)+'px');
  const centrar=()=>{ const g=svg.querySelector('.proy'); if(!g) return; const m=g.transform.baseVal[0].matrix, vb=svg.viewBox.baseVal, r=svg.getBoundingClientRect();
    ms.scrollLeft=(m.e-vb.x)/vb.width*r.width-ms.clientWidth*.6; ms.scrollTop=(m.f-vb.y)/vb.height*r.height-ms.clientHeight*.6; };
  aplicar(); requestAnimationFrame(centrar); addEventListener('resize',aplicar);
  $$('[data-mz]').forEach(b=>b.onclick=()=>{ z=Math.min(3,Math.max(1,z*(b.dataset.mz>0?1.4:1/1.4))); aplicar(); centrar(); });
  const marcar=k=>$$('.mk').forEach(m=>m.classList.toggle('on',m.dataset.ref===k));
  $$('.mapa-info li[data-ref]').forEach(li=>{ li.onmouseenter=()=>marcar(li.dataset.ref); li.onclick=()=>marcar(li.dataset.ref); });
  const mi=$('.mapa-info'); if(mi) mi.onmouseleave=()=>marcar(null);
  let d=null; ms.addEventListener('mousedown',e=>{d={x:e.clientX,y:e.clientY,l:ms.scrollLeft,t:ms.scrollTop};ms.style.cursor='grabbing'});
  addEventListener('mousemove',e=>{ if(d){ ms.scrollLeft=d.l-(e.clientX-d.x); ms.scrollTop=d.t-(e.clientY-d.y);} });
  addEventListener('mouseup',()=>{d=null;ms.style.cursor=''});
}

/* ======================= NAV, ANIMACIONES, LINK DIRECTO ======================= */
const nav=$('#nav'); const onS=()=>nav.classList.toggle('solida',scrollY>60); addEventListener('scroll',onS,{passive:true}); onS();
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.12});
$$('.rev').forEach(el=>io.observe(el));
function porHash(){ const h=decodeURIComponent(location.hash.slice(1)); if(h && window.__abrirUnidad && E && E.niveles.some(n=>n.unidades.some(u=>u.id===h))) window.__abrirUnidad(h,true); }
addEventListener('hashchange',porHash); porHash();
})();
</script>
<script src="extras.js"></script>
</body>
